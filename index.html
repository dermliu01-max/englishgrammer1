:root{
  --bg:#fff7ed; --ink:#3d3226; --soft:#7c6f62; --card:#fff;
  --u1b:#ffe6d2; --u2b:#d5f3f1; --u3b:#e5e1ff; --u4b:#ffdcef;
  --good:#2fa96b; --goodb:#dcf5e8; --bad:#e8543f; --badb:#ffe1dc;
  --gold:#ffc233; --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  /* Andika 在前 → 英文用書寫體單層 a・g；中文沒有字符會自動落到後面的中文字型 */
  font-family:"Andika","PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
}
.emo,.pic,.icon,.bi,.ai,.bg,.big,.mcard .pic,.fsent .pic,.faces{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Android Emoji",sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%, #ffe9d6 0 90px, transparent 91px),
    radial-gradient(circle at 88% 22%, #dff5f2 0 110px, transparent 111px),
    radial-gradient(circle at 20% 88%, #ece8ff 0 100px, transparent 101px),
    radial-gradient(circle at 92% 82%, #ffe3f1 0 90px, transparent 91px);
  opacity:.7;
}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px 130px}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;padding:12px 4px 10px;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(255,247,237,0))}
.back,.tbtn{border:none;background:#fff;color:var(--ink);width:46px;height:46px;border-radius:16px;flex:0 0 auto;
  font-size:21px;cursor:pointer;box-shadow:0 3px 0 #e7dbcb;font-family:inherit}
.back:active,.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7dbcb}
.title{font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starbox{display:flex;align-items:center;gap:5px;background:#fff;padding:9px 13px;border-radius:16px;
  font-weight:800;font-size:16px;box-shadow:0 3px 0 #e7dbcb;flex:0 0 auto}
.starbox.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

.hero{text-align:center;padding:10px 0 20px}
.hero h1{font-size:31px;margin:0 0 6px;letter-spacing:1px}
.hero p{margin:0;color:var(--soft);font-size:14px}
.hero .faces{font-size:38px;letter-spacing:2px;margin-bottom:6px}

.unitgrid{display:grid;gap:16px}
.unit{border:none;text-align:left;width:100%;background:var(--card);border-radius:var(--r);padding:18px;
  display:flex;align-items:center;gap:15px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;position:relative;
  overflow:hidden;font-family:inherit;color:inherit}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.unit .icon{width:72px;height:72px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;font-size:38px}
.unit .meta{flex:1;min-width:0}
.unit .no{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.75}
.unit .nm{font-size:20px;font-weight:800;margin:2px 0 3px}
.unit .en{font-size:13px;color:var(--soft);font-weight:600}
.bar{height:9px;border-radius:9px;background:#f0e7db;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.unit .badge{position:absolute;top:10px;right:12px;font-size:23px}
.setdots{display:flex;gap:5px;margin-top:8px;font-size:11px;font-weight:800;color:var(--soft)}
.setdots span{padding:2px 8px;border-radius:8px;background:#f2eae0}
.setdots span.full{background:var(--goodb);color:var(--good)}

.shelf{background:#fff;border-radius:var(--r);padding:16px 18px;margin-top:20px;box-shadow:0 5px 0 #e7dbcb}
.shelf h3{margin:0 0 10px;font-size:16px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bg{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:29px;
  background:#f4ece2;filter:grayscale(1);opacity:.45}
.bg.on{filter:none;opacity:1;background:#fff6dc;box-shadow:0 0 0 3px var(--gold) inset}

.banner{border-radius:var(--r);padding:20px;color:#fff;margin-bottom:16px;text-align:center}
.banner .bi{font-size:50px;line-height:1}
.banner h2{margin:6px 0 2px;font-size:23px}
.banner p{margin:0;opacity:.92;font-size:14px;font-weight:600}

.setpick{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 #e7dbcb}
.setpick h4{margin:0 0 10px;font-size:14px;color:var(--soft)}
.setrow{display:flex;gap:9px}
.setbtn{flex:1;border:none;font-family:inherit;background:#f4ece2;color:var(--soft);font-weight:800;font-size:16px;
  padding:13px 6px;border-radius:15px;cursor:pointer;position:relative}
.setbtn.on{color:#fff}
.setbtn .ok{position:absolute;top:3px;right:6px;font-size:12px}

.acts{display:grid;gap:12px}
.act{border:none;font-family:inherit;color:inherit;text-align:left;background:#fff;border-radius:var(--r);
  padding:15px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;width:100%}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.act .ai{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:27px;flex:0 0 auto;background:#f6efe6}
.act .at{flex:1}
.act .at b{display:block;font-size:17px}
.act .at span{font-size:12.5px;color:var(--soft)}
.act .ck{font-size:22px;opacity:.25}
.act .ck.on{opacity:1}

.chtag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:10px;
  background:#f4ece2;color:#8a7a68;margin-bottom:10px}
.scene{position:relative;width:200px;height:150px;margin:0 auto 8px}
.sbox{position:absolute;width:80px;height:54px;border:5px solid #c39a68;background:#f8e8ce;border-radius:10px;z-index:1}
.sball{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-50%)}

.tcard{background:#fff;border-radius:26px;padding:24px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb;
  margin-bottom:15px;animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.tcard .pic{font-size:78px;line-height:1.15;margin-bottom:10px}
.tcard .en{font-size:28px;font-weight:800;margin-bottom:6px;line-height:1.35}
.tcard .zh{font-size:17px;color:var(--soft);font-weight:600;margin-bottom:15px}
.speak{border:none;font-family:inherit;cursor:pointer;background:var(--gold);color:#5b4400;font-weight:800;
  font-size:16px;padding:13px 25px;border-radius:18px;box-shadow:0 4px 0 #d9a015}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a015}
.tip{background:#fff9e6;border-radius:18px;padding:14px 16px;font-size:15px;font-weight:600;line-height:1.7;
  box-shadow:0 4px 0 #f0e2bd;margin-bottom:15px}
.tip b{color:#c47b00}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 14px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#e2d5c4}
.dots i.on{width:22px;border-radius:9px}
.nav{display:flex;gap:11px}
.btn{flex:1;border:none;font-family:inherit;cursor:pointer;padding:15px;border-radius:18px;font-size:16px;
  font-weight:800;background:#fff;color:var(--ink);box-shadow:0 4px 0 #e7dbcb}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e7dbcb}
.btn.pri{color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.4;pointer-events:none}

.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;
  color:var(--soft);margin-bottom:9px}
.qcard{background:#fff;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 6px 0 #e7dbcb;margin-bottom:15px}
.qcard .pic{font-size:66px;margin-bottom:8px}
.qcard .sent{font-size:25px;font-weight:800;line-height:1.55;margin-bottom:6px}
.blank{display:inline-block;min-width:86px;border-bottom:5px solid #ccc;color:transparent}
.blank.filled{color:var(--good);border-color:var(--good)}
.qcard .zh{font-size:15px;color:var(--soft);font-weight:600}
.opts{display:grid;gap:11px}
.opt{border:none;font-family:inherit;cursor:pointer;width:100%;background:#fff;padding:17px;border-radius:20px;
  font-size:21px;font-weight:800;box-shadow:0 5px 0 #e7dbcb;color:var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.opt.ok{background:var(--goodb);color:var(--good);box-shadow:0 5px 0 #b6e6cf}
.opt.no{background:var(--badb);color:var(--bad);box-shadow:0 5px 0 #f7c3ba;animation:shake .4s}
.opt.dim{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{border-radius:20px;padding:14px 16px;font-size:15.5px;font-weight:700;line-height:1.65;margin-top:13px;animation:slide .3s ease}
.fb.ok{background:var(--goodb);color:#1d7a4b}
.fb.no{background:var(--badb);color:#b23a28}

.hintline{text-align:center;font-size:14px;color:var(--soft);font-weight:700;margin-bottom:13px;line-height:1.6}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
@media(max-width:420px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:#fff;border-radius:20px;padding:12px 7px;text-align:center;box-shadow:0 5px 0 #e7dbcb}
.mcard .pic{font-size:44px;line-height:1.1}
.slot{margin-top:9px;min-height:44px;border-radius:14px;border:3px dashed #ddd0be;display:grid;place-items:center;
  font-size:15px;font-weight:800;color:#c3b5a3;padding:4px 5px;word-break:break-word}
.slot.hot{background:#fff2e6;transform:scale(1.05)}
.slot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.slot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.fsent{background:#fff;border-radius:22px;padding:18px 15px;box-shadow:0 5px 0 #e7dbcb;margin-bottom:11px;
  display:flex;gap:12px;align-items:center}
.fsent .pic{font-size:38px;flex:0 0 auto}
.fsent .body{flex:1}
.fsent .line{font-size:20px;font-weight:800;line-height:1.95}
.fsent .zh{font-size:13px;color:var(--soft);font-weight:600;margin-top:4px}
.islot{display:inline-grid;place-items:center;vertical-align:middle;min-width:90px;height:40px;border-radius:12px;
  border:3px dashed #ddd0be;color:#c3b5a3;font-size:17px;padding:0 8px;margin:0 3px}
.islot.hot{background:#fff2e6}
.islot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.islot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.bank{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-radius:26px 26px 0 0;
  padding:13px 15px calc(15px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.1);
  display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:0 auto}
.chip{color:#fff;font-weight:800;font-size:18px;padding:12px 18px;border-radius:16px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:grab;touch-action:none;user-select:none}
.chip.sel{outline:4px solid var(--gold);transform:translateY(-4px)}
.chip.dragging{opacity:.3}
.chip.used{visibility:hidden}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.95;transform:scale(1.1) rotate(-3deg);margin:0}

.done{background:#fff;border-radius:26px;padding:34px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb}
.done .big{font-size:74px;animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.done h2{font-size:24px;margin:10px 0 6px}
.done p{color:var(--soft);font-weight:600;margin:0 0 8px}
.done .got{font-size:31px;letter-spacing:4px;margin:12px 0 18px}
.conf{position:fixed;top:-20px;font-size:24px;z-index:900;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}

/* ---------- 老師模式 ---------- */
.tsec{background:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 5px 0 #e7dbcb}
.tsec h3{margin:0 0 4px;font-size:17px}
.tsec p.d{margin:0 0 12px;font-size:13px;color:var(--soft);font-weight:600;line-height:1.6}
.picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.pk{border:none;font-family:inherit;background:#f4ece2;color:var(--soft);font-weight:800;font-size:14px;
  padding:10px 14px;border-radius:13px;cursor:pointer}
.pk.on{background:var(--ink);color:#fff}
.tgo{border:none;font-family:inherit;width:100%;padding:14px;border-radius:16px;font-size:16px;font-weight:800;
  color:#fff;background:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tgo:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.switch b{font-size:15px}
.switch span{font-size:12.5px;color:var(--soft);font-weight:600;display:block;margin-top:2px}
.sw{width:56px;height:32px;border-radius:20px;background:#ddd0be;position:relative;flex:0 0 auto;cursor:pointer;border:none}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--good)}
.sw.on i{left:28px}

table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{padding:8px 6px;text-align:left;border-bottom:1px solid #f0e7db}
table.rep th{font-size:12px;color:var(--soft)}
table.rep td.n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;font-size:12px;font-weight:800}
.pill.g{background:var(--goodb);color:var(--good)}
.pill.y{background:#fff2d4;color:#b5820c}
.pill.r{background:var(--badb);color:var(--bad)}
.wrongitem{background:#fffaf6;border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:14px;line-height:1.7}
.wrongitem b{color:var(--bad)}

/* ---------- 補習班單字 ---------- */
.vhead{background:#fff;border-radius:var(--r);padding:15px 17px;margin-bottom:14px;box-shadow:0 5px 0 #e7dbcb}
.vhead h2{margin:0 0 3px;font-size:21px}
.vhead .n{font-size:13px;color:var(--soft);font-weight:700}
.vrow{border:none;font-family:inherit;color:inherit;text-align:left;background:#fff;border-radius:18px;
  padding:15px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;width:100%;margin-bottom:11px}
.vrow:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.vrow .vi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:20px;
  font-weight:800;flex:0 0 auto;background:#e9f3ff;color:#3b6ea8}
.vrow .vt{flex:1;min-width:0}
.vrow .vt b{display:block;font-size:17px}
.vrow .vt span{font-size:12.5px;color:var(--soft);font-weight:600}
.vrow .varr{color:#cbbba6;font-size:19px}
.vtag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;
  background:#fff2d4;color:#b5820c;margin-left:5px}

.wtab{width:100%;border-collapse:collapse;font-size:14.5px}
.wtab td{padding:7px 8px;border-bottom:1px solid #f2ebe1;line-height:1.55}
.wtab tr:last-child td{border-bottom:none}
.wtab td.i{width:30px;color:var(--soft);font-size:12px;font-weight:800;text-align:right}
.wtab td.e{font-weight:800;white-space:nowrap}
.wtab td.z{color:var(--soft);font-weight:600;font-size:13.5px}
.wtab td.s{width:40px;text-align:right}
.wtab tr.mk td.e{color:#b5820c}
.mini{border:none;background:#f4ece2;color:var(--soft);font-size:13px;padding:5px 9px;border-radius:9px;
  cursor:pointer;font-family:inherit}

.vcard{background:#fff;border-radius:26px;padding:30px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb;
  margin-bottom:15px;animation:slide .3s ease}
.vcard .w{font-size:44px;font-weight:800;line-height:1.25;word-break:break-word}
.vcard .z{font-size:20px;color:var(--soft);font-weight:700;margin-top:10px;min-height:28px}
.vcard .hidden{color:#e2d5c4}

.blanks{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.bl{width:38px;height:50px;border-radius:11px;background:#f6efe6;display:grid;place-items:center;
  font-size:25px;font-weight:800;color:var(--ink)}
.bl.gap{background:#fff;border:3px dashed #ddd0be;color:transparent}
.bl.gap.next{border-color:var(--gold);background:#fffaed}
.bl.sp{width:14px;background:transparent}
.bl.wrong{animation:shake .4s}
.letters{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.lt{border:none;font-family:inherit;background:#3b6ea8;color:#fff;font-weight:800;font-size:22px;
  width:52px;height:52px;border-radius:15px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.lt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.lt.used{visibility:hidden}

textarea.paste{width:100%;min-height:190px;border:3px solid #ecdfd0;border-radius:16px;padding:13px;
  font-family:inherit;font-size:14.5px;line-height:1.75;resize:vertical;background:#fffdfa;color:var(--ink)}
textarea.paste:focus{outline:none;border-color:var(--gold)}
.pv{background:#f6fbf7;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.8;
  max-height:210px;overflow-y:auto;margin-top:10px}
.pv b{color:#1d7a4b}
input.tin{width:100%;border:3px solid #ecdfd0;border-radius:14px;padding:12px;font-family:inherit;
  font-size:15px;background:#fffdfa;color:var(--ink);margin-bottom:10px}
input.tin:focus{outline:none;border-color:var(--gold)}

/* ---------- 儲存狀態 ---------- */
.resume{display:flex;align-items:center;gap:9px;background:#eef7f1;border-radius:14px;padding:9px 13px;
  margin-bottom:11px;font-size:13.5px;font-weight:700;color:#1d7a4b}
.resume span{flex:1}
.resume button{border:none;font-family:inherit;background:#fff;color:var(--soft);font-weight:800;font-size:12.5px;
  padding:7px 13px;border-radius:11px;cursor:pointer;box-shadow:0 2px 0 #d5e5da}
.savecard{background:#fff;border-radius:var(--r);padding:15px 17px;margin-top:18px;box-shadow:0 5px 0 #e7dbcb}
.savecard h3{margin:0 0 10px;font-size:16px}
.saverow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}
.saverow .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.saverow .dot.on{background:var(--good);box-shadow:0 0 0 4px #dcf5e8}
.saverow .dot.off{background:var(--bad);box-shadow:0 0 0 4px #ffe1dc}
.saverow b{font-weight:800}
.saverow .t{flex:1}
.saverow .v{color:var(--soft);font-weight:700;font-variant-numeric:tabular-nums}
.savebtns{display:flex;gap:9px;margin-top:10px}
.savebtns button{flex:1;border:none;font-family:inherit;padding:13px 8px;border-radius:15px;font-size:14px;
  font-weight:800;cursor:pointer;background:#f4ece2;color:var(--ink);box-shadow:0 4px 0 #e7dbcb}
.savebtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #e7dbcb}
.savebtns button.hi{background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.savewarn{background:#ffe1dc;color:#b23a28;border-radius:14px;padding:11px 13px;font-size:13px;
  font-weight:700;line-height:1.7;margin-top:8px}
.savenote{font-size:12px;color:var(--soft);font-weight:600;line-height:1.7;margin-top:9px}

/* ---------- 文法總整理 / 錯題本 ---------- */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tool{border:none;font-family:inherit;color:inherit;background:#fff;border-radius:18px;padding:14px 8px;
  text-align:center;cursor:pointer;box-shadow:0 4px 0 #e7dbcb}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #e7dbcb}
.tool .ti{font-size:27px;display:block;margin-bottom:4px}
.tool b{font-size:13px;display:block}
.tool span{font-size:11px;color:var(--soft);font-weight:600}

.glist{display:grid;gap:10px}
.grow{border:none;font-family:inherit;color:inherit;text-align:left;background:#fff;border-radius:16px;
  padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 4px 0 #e7dbcb;width:100%}
.grow:active{transform:translateY(2px);box-shadow:0 2px 0 #e7dbcb}
.gnum{font-size:12px;font-weight:800;background:#f4ece2;color:#8a7a68;padding:5px 9px;border-radius:9px;flex:0 0 auto}
.gtxt{flex:1;min-width:0}
.gtxt b{display:block;font-size:15.5px}
.gtxt span{font-size:12px;color:var(--soft);font-weight:600}
.garr{color:#cbbba6;font-size:18px}

.gcard{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 0 #e7dbcb;margin-bottom:14px}
.gcard h3{margin:0 0 3px;font-size:19px}
.gcard .sub{font-size:12.5px;color:var(--soft);font-weight:700;margin-bottom:14px}
.gsec{font-size:13px;font-weight:800;color:var(--soft);margin:16px 0 8px;letter-spacing:1px}
table.gt{width:100%;border-collapse:collapse;font-size:14px;border-radius:12px;overflow:hidden}
table.gt th{background:#f4ece2;color:#6d6154;font-size:12.5px;padding:8px 9px;text-align:left;font-weight:800}
table.gt td{padding:8px 9px;border-bottom:1px solid #f2ebe1;vertical-align:top;line-height:1.6}
table.gt tr:last-child td{border-bottom:none}
table.gt td:first-child{font-weight:700;white-space:nowrap}
ul.gp{margin:0;padding-left:18px}
ul.gp li{font-size:14.5px;line-height:1.85;margin-bottom:5px}
.exline{background:#fbf7f1;border-radius:12px;padding:10px 13px;margin-bottom:7px}
.exline .e{font-size:16.5px;font-weight:700;line-height:1.5}
.exline .z{font-size:12.5px;color:var(--soft);font-weight:600;margin-top:2px}
.exline .sp{float:right;border:none;background:var(--gold);color:#5b4400;font-weight:800;font-size:12px;
  padding:5px 11px;border-radius:9px;cursor:pointer;font-family:inherit;margin-left:8px}
.errbox{background:#fff6f4;border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:14px;line-height:1.85}
.errbox .x{color:var(--bad);font-weight:800;text-decoration:line-through;text-decoration-color:#f0a99c}
.errbox .o{color:var(--good);font-weight:800}
.errbox .w{display:block;font-size:12.5px;color:var(--soft);font-weight:600}
.ovwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ov{border-collapse:collapse;font-size:13px;min-width:640px}
table.ov th{background:#f4ece2;padding:9px;text-align:left;font-size:12.5px;position:sticky;left:0}
table.ov th:first-child{background:#efe4d6}
table.ov td{padding:9px;border-bottom:1px solid #f2ebe1;line-height:1.6;vertical-align:top}
table.ov td:first-child{font-weight:800;background:#fbf7f1;white-space:nowrap}

.wbgroup{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 0 #e7dbcb}
.wbhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.wbhead .c{font-size:13px;font-weight:800;background:#ffe1dc;color:#b23a28;padding:4px 10px;border-radius:9px}
.wbhead .t{flex:1;font-size:14px;font-weight:800}
.wbhead .n{font-size:12px;color:var(--soft);font-weight:700}
.wbq{font-size:14px;line-height:1.8;padding:8px 0;border-top:1px solid #f4ece2}
.wbq .a{color:var(--good);font-weight:800}
.wbq .z{font-size:12px;color:var(--soft);font-weight:600}
.wbbtn{border:none;font-family:inherit;width:100%;margin-top:10px;padding:11px;border-radius:13px;
  font-size:14px;font-weight:800;background:#ffe1dc;color:#b23a28;cursor:pointer}

/* ---------- 投影模式 ---------- */
#proj{position:fixed;inset:0;z-index:200;background:#fffdf8;display:none;flex-direction:column;padding:20px}
#proj.on{display:flex}
#proj .ph{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;color:var(--soft)}
#proj .pbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
#proj .ppic{font-size:min(18vw,140px);line-height:1}
#proj .psent{font-size:min(7vw,62px);font-weight:800;line-height:1.4}
#proj .pzh{font-size:min(3.4vw,28px);color:var(--soft);font-weight:700}
#proj .popts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#proj .popt{font-size:min(4.4vw,38px);font-weight:800;padding:14px 30px;border-radius:18px;background:#f4ece2}
#proj .popt.ok{background:var(--goodb);color:var(--good)}
#proj .pwhy{font-size:min(3vw,25px);font-weight:700;background:#fff9e6;border-radius:16px;padding:14px 20px;max-width:900px}
#proj .pf{display:flex;gap:12px;justify-content:center}
#proj .pf button{border:none;font-family:inherit;font-size:19px;font-weight:800;padding:15px 28px;border-radius:16px;
  background:#fff;box-shadow:0 4px 0 #e7dbcb;cursor:pointer;color:var(--ink)}
#proj .pf button.pri{background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#proj .scene{transform:scale(1.5);margin:24px auto 30px}
@media(max-width:700px){
  #proj{padding:14px 10px}
  #proj .ph{font-size:13px}
  #proj .pf{flex-wrap:wrap;gap:8px}
  #proj .pf button{font-size:15px;padding:12px 15px}
  #proj .psent{font-size:30px}
  #proj .pzh{font-size:16px}
  #proj .popt{font-size:22px;padding:11px 20px}
  #proj .pwhy{font-size:15px;padding:11px 14px}
  #proj .ppic{font-size:74px}
}

/* ---------- 列印 ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  body::before{display:none}
  #app,#proj,#bankwrap{display:none !important}
  #print{display:block !important;color:#000}
  .sheet{page-break-after:always;padding:0}
  .sheet:last-child{page-break-after:auto}
}
#print{font-family:"Andika","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#000}
#print .sheet{max-width:760px;margin:0 auto 40px;background:#fff;padding:24px}
#print h1{font-size:22px;margin:0 0 4px;border-bottom:3px solid #000;padding-bottom:8px}
#print .meta{font-size:13px;margin:8px 0 18px;display:flex;gap:26px}
#print h2{font-size:16px;margin:20px 0 10px;background:#eee;padding:6px 10px;border-radius:4px}
#print ol{margin:0;padding-left:22px}
#print li{margin-bottom:11px;font-size:14.5px;line-height:1.85}
#print .zhs{color:#555;font-size:12.5px;margin-left:6px}
#print .ops{margin-left:6px;font-size:14px}
#print .wordbank{border:1.5px dashed #666;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px;
  font-weight:700;letter-spacing:1px}
#print .mtab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#print .mcell{border:1.5px solid #999;border-radius:8px;padding:10px;text-align:center}
#print .mcell .e{font-size:34px}
#print .mcell .ln{border-bottom:1.5px solid #000;height:22px;margin-top:8px}
#print .key{font-size:14px;line-height:2}
#print .key b{display:inline-block;min-width:34px}
#print table.gpt{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:9px}
#print table.gpt th{background:#eee;padding:6px 8px;text-align:left;border:1px solid #bbb;font-size:12px}
#print table.gpt td{padding:6px 8px;border:1px solid #ccc;vertical-align:top;line-height:1.55}
#print ul.gpl{margin:0 0 8px 0;padding-left:20px;font-size:13.5px;line-height:1.75}
#print .gex{font-size:13.5px;line-height:1.85;background:#f7f7f7;border-radius:6px;padding:8px 10px;margin-bottom:8px}
#print .gerr{font-size:13.5px;line-height:1.85;border-left:3px solid #999;padding:4px 0 4px 10px;margin-bottom:10px}
#print h2{page-break-after:avoid}
</style>
</head>

/* 由 quizSlots / matchSets / fillSets 展開成 A、B、C 三卷 */
const SETS = ["A","B","C"];
UNITS.forEach(u=>{
  u.sets = {};
  SETS.forEach(t=>u.sets[t] = {quiz:[], match:[], fill:[]});
  u.quizSlots.forEach((slot,si)=>{
    SETS.forEach(t=>{
      const v = slot[t]; if(!v) return;
      u.sets[t].quiz.push({
        id: u.id+"-"+t+"-q"+si,
        ch: v.ch || slot.ch,
        pic: v.pic, scene: v.scene,
        a: v.a, b: v.b, zh: v.zh,
        o: v.o || slot.o,
        k: v.k,
        why: v.why || slot.why
      });
    });
  });
  SETS.forEach(t=>{
    u.sets[t].match = (u.matchSets[t]||[]).map((m,i)=>Object.assign({id:u.id+"-"+t+"-m"+i}, m));
    u.sets[t].fill  = (u.fillSets[t]||[]).map((f,i)=>Object.assign({id:u.id+"-"+t+"-f"+i}, f));
  });
});

      ["Lemons aren't sweet. They're sour.","檸檬不是甜的，是酸的。"]],
  err:[["I amn't a teacher.","I'm not a teacher.","沒有 amn't 這個字"],
       ["She not is here.","She is not here.","not 要放在 be 後面"]]},

 {ch:"1-7", t:"be + 形容詞", en:"Be + Adjective",
  head:["主詞","be","形容詞"],
  rows:[["A ball","is","round."],["Balls","are","round."],
        ["I","am","hungry."],["They","are","happy."]],
  pts:["<b>形容詞</b>是用來說明「長什麼樣子、什麼感覺」的字，例如 round、big、happy、hungry。",
       "形容詞常常放在 be 動詞的<b>後面</b>，用來形容前面的主詞。",
       "形容詞<b>不會有複數</b>：不能說 Balls are rounds."],
  ex:[["Fire is hot.","火是燙的。"],
      ["An elephant is big, but a mouse is little.","大象很大，但老鼠很小。"],
      ["Ice and snow are cold.","冰和雪是冷的。"]],
  err:[["A ball round.","A ball is round.","不能漏掉 be 動詞"],
       ["They are happys.","They are happy.","形容詞不加 s"]]},

 {ch:"1-8", t:"be + 地方", en:"Be + a Place",
  head:["類型","例子"],
  rows:[["一個字的地方","here, there, downstairs, upstairs, inside, outside, downtown"],
        ["介系詞 + 名詞","at the library, on the bus, in his room, at work, next to Amy"],
        ["常用介系詞","above, at, behind, between, from, in, next to, on, under"]],
  pts:["be 後面除了名詞、形容詞，還可以放<b>地方</b>。",
       "地方可以是一個單字（here），也可以是「介系詞 + 名詞」（at the library）。",
       "<b>on</b> 是碰到表面，<b>above</b> 是在上方但沒碰到，兩個不一樣。"],
  ex:[["Amy is here.","Amy 在這裡。"],
      ["Bob is at the library.","Bob 在圖書館。"],
      ["The cat is under the desk.","貓在書桌下面。"]],
  err:[["The ball is on the box.（球飄在空中）","The ball is above the box.","沒碰到要用 above"],
       ["Bob is library.","Bob is at the library.","地方前面要有介系詞"]]},

 {ch:"1-9", t:"be 的三種基本句型", en:"Summary: Basic Sentence Patterns with Be",
  head:["句型","例句","後面是什麼"],
  rows:[["主詞 + be + <b>名詞</b>","I am a student.","名詞"],
        ["主詞 + be + <b>形容詞</b>","He is intelligent.","形容詞"],
        ["主詞 + be + <b>地方</b>","We are in class.","地方"],
        ["主詞 + be + <b>地方</b>","She is upstairs.","地方（一個字）"]],
  pts:["句子開頭的名詞或代名詞叫做 <b>主詞（subject）</b>。",
       "be 是一種<b>動詞</b>。幾乎每個英文句子都要有主詞和動詞。",
       "be 後面只有這<b>三種可能</b>：名詞、形容詞、地方。看到句子先判斷是哪一種。"],
  ex:[["We're students. → be + 名詞","我們是學生。"],
      ["I'm hungry. → be + 形容詞","我肚子餓。"],
      ["Anna is in Rome. → be + 地方","Anna 在羅馬。"]],
  err:[["I student.","I am a student.","句子一定要有動詞"]]}
]},

{u:2, title:"問問題・我有", en:"Chapter 2 · Using Be and Have", items:[

 {ch:"2-1", t:"be 的 Yes/No 問句", en:"Yes/No Questions with Be",
  head:["直述句","問句"],
  rows:[["I <b>am</b> early.","<b>Am</b> I early?"],
        ["Amy <b>is</b> a student.","<b>Is</b> Amy a student?"],
        ["They <b>are</b> at home.","<b>Are</b> they at home?"]],
  pts:["把 <b>be 動詞搬到主詞前面</b>，就變成問句了，其他字順序不變。",
       "問句結尾要用<b>問號 ?</b>，直述句結尾用<b>句點 .</b>。",
       "問句開頭第一個字母要<b>大寫</b>。"],
  ex:[["Are you tired?","你累了嗎？"],
      ["Is he late?","他遲到了嗎？"],
      ["Are you and Bill ready?","你和 Bill 準備好了嗎？"]],
  err:[["You are tired?","Are you tired?","be 要搬到最前面"],
       ["Is they at home?","Are they at home?","they 配 are"]]},

 {ch:"2-2", t:"短答", en:"Short Answers to Yes/No Questions",
  head:["問句","Yes 短答","No 短答"],
  rows:[["Is Lily a student?","Yes, she <b>is</b>.","No, she's not. / No, she <b>isn't</b>."],
        ["Are they at home?","Yes, they <b>are</b>.","No, they're not. / No, they <b>aren't</b>."],
        ["Are you ready?","Yes, I <b>am</b>.","No, <b>I'm not</b>."]],
  pts:["回答 <b>Yes</b> 的時候<b>不能縮寫</b>：要說 Yes, she is.（不可以說 Yes, she's.）",
       "回答 <b>No</b> 的時候可以縮寫，而且通常有兩種說法。",
       "回答要用<b>代名詞</b>（she、he、they），不要重複整個名字。"],
  ex:[["Are dolphins smart? — Yes, they are.","海豚聰明嗎？——對，牠們很聰明。"],
      ["Is Judy here today? — No, she isn't.","Judy 今天在嗎？——不在。"]],
  err:[["Yes, she's.","Yes, she is.","Yes 短答不能縮寫"],
       ["No, I amn't.","No, I'm not.","am not 只能縮成 I'm not"]]},

 {ch:"2-3", t:"Where 問句", en:"Questions with Be: Using Where",
  head:["問句","短答","完整答句"],
  rows:[["<b>Is</b> the book on the table?","Yes, it is.","The book is on the table."],
        ["<b>Where is</b> the book?","On the table.","The book is on the table."],
        ["<b>Where are</b> the books?","On the table.","The books are on the table."]],
  pts:["<b>Where</b> 是問「在哪裡」，要放在<b>句子最前面、be 的前面</b>。",
       "順序是 <b>Where + be + 主詞 ?</b>",
       "Where 問句<b>不能用 Yes / No 回答</b>，要直接說地點。"],
  ex:[["Where is Lily? — At home.","Lily 在哪裡？——在家。"],
      ["Where are my glasses? — On your head!","我的眼鏡在哪裡？——在你頭上！"]],
  err:[["Where the book is?","Where is the book?","be 要放在主詞前面"],
       ["Where is Lily? — Yes.","Where is Lily? — At home.","Where 不能用 Yes 回答"]]},

 {ch:"2-4", t:"have 和 has", en:"Using Have and Has",
  head:["主詞","動詞","例句"],
  rows:[["I / You / We / They","<b>have</b>","I have a pen."],
        ["She / He / It","<b>has</b>","She has a pen."]],
  pts:["have 和 has 是<b>同一個字</b>，意思都是「有」，只是主詞不同要換形式。",
       "只要主詞是<b>一個人或一樣東西</b>（he / she / it 或一個人的名字）就用 <b>has</b>。",
       "人名要先判斷是「一個人」還是「很多人」：Jack → has；Jack and Tom → have。"],
  ex:[["I have a bike.","我有一台腳踏車。"],
      ["He has a motorcycle.","他有一台機車。"],
      ["Jack and Tom have trucks.","Jack 和 Tom 有卡車。"]],
  err:[["She have a car.","She has a car.","she 用 has"],
       ["I has a pen.","I have a pen.","I 用 have"]]},

 {ch:"2-5", t:"所有格形容詞", en:"Using My, Your, Her, His, Our, Their",
  head:["主詞","所有格","例句"],
  rows:[["I","<b>my</b>","My book is red."],["you","<b>your</b>","Your book is red."],
        ["she","<b>her</b>","Her book is red."],["he","<b>his</b>","His book is red."],
        ["we","<b>our</b>","Our books are red."],["they","<b>their</b>","Their books are red."]],
  pts:["這些字表示「誰的」，叫做 <b>所有格形容詞</b>。",
       "所有格<b>一定要放在名詞前面</b>，不能單獨使用。",
       "所有格<b>不會變複數</b>：my book / my books 都是 my。"],
  ex:[["Jenny has on a blouse. <b>Her</b> blouse is light blue.","Jenny 穿著上衣，她的上衣是淺藍色。"],
      ["Jack and Tom have on boots. <b>Their</b> boots are brown.","Jack 和 Tom 穿著靴子，他們的靴子是棕色。"]],
  err:[["He book is red.","His book is red.","he 是主詞，his 才是所有格"],
       ["Their are my books.","Those are my books.","their 是「他們的」，不是「那些」"]]},

 {ch:"2-6", t:"this 和 that", en:"Using This and That",
  head:["用字","距離","例句"],
  rows:[["<b>this</b>","靠近我（拿在手上、就在旁邊）","This is my book."],
        ["<b>that</b>","離我比較遠（在那邊）","That is your book."]],
  pts:["this 和 that 都是<b>單數</b>，後面配 <b>is</b>。",
       "<b>that is</b> 可以縮寫成 <b>that's</b>；this is 在書寫時<b>不縮寫</b>。",
       "判斷方法很簡單：東西<b>近</b>用 this，<b>遠</b>用 that。"],
  ex:[["This is my book.（拿在手上）","這是我的書。"],
      ["That's her book.（在那邊桌上）","那是她的書。"]],
  err:[["This are my books.","These are my books.","this 只能配單數"],
       ["This's my book.","This is my book.","this is 不縮寫"]]},

 {ch:"2-7", t:"these 和 those", en:"Using These and Those",
  head:["單數","複數","距離"],
  rows:[["this","<b>these</b>","近（這些）"],["that","<b>those</b>","遠（那些）"]],
  pts:["these 是 this 的複數，those 是 that 的複數，後面配 <b>are</b>。",
       "後面的名詞也要加 <b>s</b>：These are my book<b>s</b>.",
       "四個字合起來記：<b>近單 this、近複 these、遠單 that、遠複 those</b>。"],
  ex:[["These are my books.","這些是我的書。"],
      ["Those are her shoes.","那些是她的鞋子。"],
      ["Those sheets are for you.","那些床單是給你的。"]],
  err:[["These is my books.","These are my books.","these 配 are"],
       ["Those book are new.","Those books are new.","名詞也要複數"]]},

 {ch:"2-8", t:"What 和 Who + be", en:"Asking Questions with What and Who + Be",
  head:["問句","問什麼","回答"],
  rows:[["<b>What is</b> this?","東西（單數）","It's a pen."],
        ["<b>What are</b> those?","東西（複數）","They're pens."],
        ["<b>Who is</b> that man?","人（單數）","That's Mr. Lee."],
        ["<b>Who are</b> they?","人（複數）","They're Mr. and Mrs. Lee."]],
  pts:["問<b>東西</b>用 <b>What</b>，問<b>人</b>用 <b>Who</b>。",
       "後面接單數就用 is，接複數就用 are。",
       "縮寫：what is → <b>what's</b>；who is → <b>who's</b>。"],
  ex:[["What's this? — It's my new camera.","這是什麼？——是我的新相機。"],
      ["Who's that woman? — She's my sister.","那位女士是誰？——她是我姊姊。"],
      ["What are bats? — They're animals with wings.","蝙蝠是什麼？——是有翅膀的動物。"]],
  err:[["What are that?","What is that?","that 是單數"],
       ["Who is those people?","Who are those people?","people 是複數"]]}
]},

{u:3, title:"我每天做的事", en:"Chapter 3 · Simple Present", items:[

 {ch:"3-1", t:"現在簡單式的形式與意義", en:"Form and Basic Meaning of the Simple Present",
  head:["主詞","動詞","例句"],
  rows:[["I / You / We / They","talk（原形）","I talk. / They talk."],
        ["She / He / It","talk<b>s</b>（加 s）","She talks. / It rains."]],
  pts:["現在簡單式用來說<b>習慣</b>——每天、每週固定會做的事。",
       "只有主詞是 <b>she / he / it</b>（第三人稱單數）時，動詞才加 <b>-s</b>。",
       "常出現的時間詞：<b>every morning / every day / every night / every weekend</b>。"],
  ex:[["I eat breakfast every morning.","我每天早上吃早餐。"],
      ["Anna speaks English every day.","Anna 每天說英文。"],
      ["They go to the beach every weekend.","他們每個週末去海邊。"]],
  err:[["She eat breakfast.","She eats breakfast.","she 的動詞要加 s"],
       ["They eats lunch.","They eat lunch.","複數主詞不加 s"]]},

 {ch:"3-2", t:"次數副詞", en:"Frequency Adverbs",
  head:["副詞","頻率","中文"],
  rows:[["always","100%","總是"],["usually","約 90%","通常"],["often","約 70%","常常"],
        ["sometimes","約 50%","有時候"],["seldom","約 20%","很少"],
        ["rarely","約 10%","難得"],["never","0%","從不"]],
  pts:["次數副詞是用來說「多常做」的字。",
       "也可以用次數說法：<b>once a day</b>（一天一次）、<b>twice a week</b>（一週兩次）、<b>three times a month</b>。",
       "<b>every</b> 後面接<b>單數</b>：every morning（○）、every mornings（✗）。"],
  ex:[["Jack always eats breakfast.","Jack 總是吃早餐。"],
      ["I never drink milk.","我從不喝牛奶。"],
      ["I see my grandparents three times a week.","我一週看祖父母三次。"]],
  err:[["every mornings","every morning","every 後面用單數"]]},

 {ch:"3-3", t:"次數副詞的位置", en:"Position of Frequency Adverbs",
  head:["動詞種類","位置","例句"],
  rows:[["<b>be 動詞</b>","放在 be 的<b>後面</b>","Amy <b>is always</b> on time."],
        ["<b>一般動詞</b>","放在動詞的<b>前面</b>","Tom <b>always comes</b> late."]],
  pts:["這是最容易搞混的一條：<b>遇到 be 放後面，其他動詞放前面</b>。",
       "口訣：<b>be 後面、動詞前面</b>。",
       "sometimes 比較自由，也可以放句首或句尾：Sometimes I get up at seven."],
  ex:[["Amy is always on time for class.","Amy 上課總是準時。"],
      ["Amy always comes to class on time.","Amy 總是準時來上課。"],
      ["It often rains here. / It is often cold here.","這裡常下雨。／這裡常常很冷。"]],
  err:[["Amy always is on time.","Amy is always on time.","be 動詞要放副詞前面"],
       ["Tom comes always late.","Tom always comes late.","一般動詞要放副詞後面"]]},

 {ch:"3-4", t:"字尾加 -es 的拼寫與發音", en:"Spelling and Pronunciation of Final -es",
  head:["字尾","變化","例子"],
  rows:[["-sh","加 <b>-es</b>","push → push<b>es</b>, wash → wash<b>es</b>, brush → brush<b>es</b>"],
        ["-ch","加 <b>-es</b>","teach → teach<b>es</b>, watch → watch<b>es</b>, catch → catch<b>es</b>"],
        ["-ss","加 <b>-es</b>","kiss → kiss<b>es</b>, pass → pass<b>es</b>"],
        ["-x","加 <b>-es</b>","fix → fix<b>es</b>, mix → mix<b>es</b>"]],
  pts:["這四種字尾直接加 s 會唸不出來，所以要加 <b>-es</b>。",
       "-es 的發音是 <b>/əz/</b>，會多出一個音節：push（1 音節）→ pushes（2 音節）。",
       "記法：<b>噓（sh）吃（ch）死（ss）叉（x）</b>，這四種加 es。"],
  ex:[["Alex teaches English.","Alex 教英文。"],
      ["Jenny brushes her hair every morning.","Jenny 每天早上梳頭髮。"],
      ["Eric seldom washes dishes.","Eric 很少洗碗。"]],
  err:[["He teachs English.","He teaches English.","-ch 要加 es"],
       ["She washs the car.","She washes the car.","-sh 要加 es"]]},

 {ch:"3-5", t:"-y 結尾的動詞加 -s / -es", en:"Adding Final -s/-es to Words That End in -y",
  head:["字尾","變化","例子"],
  rows:[["<b>子音</b> + y","y 變 i，再加 <b>-es</b>","cry → cr<b>ies</b>, try → tr<b>ies</b>, fly → fl<b>ies</b>, study → stud<b>ies</b>"],
        ["<b>母音</b> + y","直接加 <b>-s</b>","pay → pa<b>ys</b>, enjoy → enjo<b>ys</b>, play → pla<b>ys</b>, buy → bu<b>ys</b>"]],
  pts:["關鍵是看 <b>y 前面那個字母</b>是子音還是母音。",
       "母音只有 <b>a, e, i, o, u</b> 五個，其他都是子音。",
       "cr<u>y</u> → y 前面是 r（子音）→ cries；pa<u>y</u> → y 前面是 a（母音）→ pays。"],
  ex:[["A bird flies in the sky.","鳥在天上飛。"],
      ["Kate pays bills.","Kate 付帳單。"],
      ["Her new baby cries during the night.","她的寶寶晚上會哭。"]],
  err:[["He crys.","He cries.","子音 + y 要變 ies"],
       ["She paies bills.","She pays bills.","母音 + y 直接加 s"]]},

 {ch:"3-6", t:"不規則的單數動詞", en:"Irregular Singular Verbs: Has, Does, Goes",
  head:["原形","she / he / it","發音"],
  rows:[["have","<b>has</b>","/hæz/"],["do","<b>does</b>","/dʌz/"],["go","<b>goes</b>","/goʊz/"]],
  pts:["這三個字不照規則變，要<b>單獨背起來</b>。",
       "have 不是 haves，是 <b>has</b>；do 不是 dos，是 <b>does</b>；go 加的是 es 不是 s。",
       "does 除了「做」，還會當<b>助動詞</b>用在否定和問句（見 3-8、3-9）。"],
  ex:[["Mrs. Wang has a car.","Wang 太太有一台車。"],
      ["Peter always does his homework.","Peter 總是做功課。"],
      ["Andy goes to school every day.","Andy 每天去上學。"]],
  err:[["She haves a car.","She has a car.","have 的變化是 has"],
       ["He gos to school.","He goes to school.","go 加 es"]]},

 {ch:"3-7", t:"like to / want to / need to", en:"Like To, Want To, Need To",
  head:["動詞","接什麼","例句"],
  rows:[["like","<b>to</b> + 原形動詞","I like to travel."],
        ["want","<b>to</b> + 原形動詞","I want to travel."],
        ["need","<b>to</b> + 原形動詞","I need to travel for my job."]],
  pts:["<b>to + 原形動詞</b> 叫做<b>不定詞（infinitive）</b>。",
       "原形動詞就是沒有加 -s、-ed、-ing 的樣子：come、help、write。",
       "語氣強弱：<b>need to</b>（必須、必要）比 <b>want to</b>（想要）強。",
       "前面的動詞照樣要配主詞加 s：She like<b>s</b> to travel."],
  ex:[["Emma needs to study.","Emma 需要念書。"],
      ["We want to go home.","我們想回家。"],
      ["Bill and I like to eat sweets.","Bill 和我喜歡吃甜食。"]],
  err:[["I want go home.","I want to go home.","不能漏掉 to"],
       ["She likes to travels.","She likes to travel.","to 後面要用原形"]]},

 {ch:"3-8", t:"現在簡單式的否定", en:"Simple Present Tense: Negative",
  head:["主詞","否定","縮寫"],
  rows:[["I / You / We / They","<b>do not</b> + 原形動詞","<b>don't</b> drink coffee"],
        ["She / He / It","<b>does not</b> + 原形動詞","<b>doesn't</b> drink coffee"]],
  pts:["do 和 does 在這裡叫做<b>助動詞</b>，專門幫忙造否定句和問句。",
       "最重要的一條：<b>用了 does，後面的動詞就不能再加 s</b>，因為 s 已經跑到 does 上面了。",
       "說話和寫作都常用縮寫 don't / doesn't。"],
  ex:[["I don't drink coffee.","我不喝咖啡。"],
      ["He doesn't drink coffee.","他不喝咖啡。"],
      ["We don't have a TV.","我們沒有電視。"]],
  err:[["She doesn't drinks coffee.","She doesn't drink coffee.","does 後面用原形"],
       ["She don't like milk.","She doesn't like milk.","she 要用 doesn't"]]},

 {ch:"3-9", t:"現在簡單式的 Yes/No 問句", en:"Simple Present: Yes/No Questions",
  head:["主詞","問句","短答"],
  rows:[["I / you / we / they","<b>Do</b> you work?","Yes, I <b>do</b>. / No, I <b>don't</b>."],
        ["she / he / it","<b>Does</b> she work?","Yes, she <b>does</b>. / No, she <b>doesn't</b>."]],
  pts:["問句要在最前面加 <b>Do</b> 或 <b>Does</b>，後面動詞用<b>原形</b>。",
       "短答要用 <b>do / does / don't / doesn't</b>，不能重複原本的動詞。",
       "<b>重要</b>：主要動詞是 be 的時候<b>不用 do</b>，直接把 be 搬到前面（見 2-1）。"],
  ex:[["Do you like tea? — Yes, I do.","你喜歡茶嗎？——對，我喜歡。"],
      ["Does Lily speak Italian? — No, she doesn't.","Lily 說義大利文嗎？——不會。"],
      ["Does Jack do his homework? — Yes, he does.","Jack 做功課嗎？——有。"]],

{u:4, title:"我正在做", en:"Chapter 4 · Present Progressive", items:[

 {ch:"4-1", t:"be + -ing：現在進行式", en:"Be + -ing: the Present Progressive",
  head:["主詞","be","動詞-ing"],
  rows:[["I","am","sitting in class right now."],
        ["She / He / It","is","sitting in class right now."],
        ["You / We / They","are","sitting in class right now."]],
  pts:["現在進行式表示<b>此時此刻正在發生</b>的動作。",
       "公式是 <b>be + 動詞-ing</b>，<b>兩個都要有</b>，少一個就錯。",
       "am / is / are 在這裡叫<b>助動詞</b>，-ing 的字才是主要動詞。",
       "常出現的時間詞：<b>now, right now, at the moment, Look!, Listen!</b>"],
  ex:[["It is raining.","正在下雨。"],
      ["I am sitting in class right now.","我現在正坐在教室裡。"],
      ["They are playing soccer.","他們正在踢足球。"]],
  err:[["I sitting in class.","I am sitting in class.","不能漏掉 be"],
       ["I am sit in class.","I am sitting in class.","動詞要加 ing"]]},

 {ch:"4-2", t:"-ing 的四條拼寫規則", en:"Spelling of -ing",
  head:["規則","字尾長相","變化","例子"],
  rows:[["規則 1","子音 + <b>e</b>","去掉 e 再加 ing","smile → smil<b>ing</b>, write → writ<b>ing</b>, take → tak<b>ing</b>"],
        ["規則 2","<b>一</b>母音 + <b>一</b>子音","最後字母<b>寫兩次</b>","sit → si<b>tt</b>ing, run → ru<b>nn</b>ing, get → ge<b>tt</b>ing"],
        ["規則 3","<b>兩</b>母音 + 一子音","直接加 ing","read → read<b>ing</b>, rain → rain<b>ing</b>"],
        ["規則 4","<b>兩</b>個子音","直接加 ing","stand → stand<b>ing</b>, push → push<b>ing</b>"]],
  pts:["先看字的<b>最後兩三個字母</b>，就能決定用哪條規則。",
       "規則 2 的<b>例外</b>：字尾是 <b>w、x、y</b> 時不重複——snow → snowing、fix → fixing、say → saying。",
       "母音是 a, e, i, o, u；其他字母都是子音。"],
  ex:[["She is writing a letter.（規則 1）","她正在寫信。"],
      ["The dog is running fast.（規則 2）","那隻狗正在快跑。"],
      ["It is raining outside.（規則 3）","外面正在下雨。"]],
  err:[["writeing","writing","字尾 e 要去掉"],
       ["runing","running","一母音一子音要重複"],
       ["rainning","raining","兩母音不重複"]]},

 {ch:"4-3", t:"進行式的否定", en:"Present Progressive: Negatives",
  head:["主詞","否定形","例句"],
  rows:[["I","am not + -ing","I am not sleeping."],
        ["She / He / It","<b>isn't</b> + -ing","Ben isn't listening."],
        ["You / We / They","<b>aren't</b> + -ing","They aren't watching TV."]],
  pts:["否定就是在 <b>be 後面加 not</b>，-ing 保持不變。",
       "<b>不可以用 don't / doesn't</b>，那是現在簡單式在用的。",
       "縮寫：is not → isn't；are not → aren't；am not 只能寫 I'm not。"],
  ex:[["It isn't raining now.","現在沒有在下雨。"],
      ["Ben isn't listening. He's daydreaming.","Ben 沒在聽，他在發呆。"],
      ["Mr. and Mrs. Lee aren't watching TV. They're reading.","Lee 夫婦沒在看電視，他們在看書。"]],
  err:[["It doesn't raining.","It isn't raining.","進行式否定用 isn't"]]},

 {ch:"4-4", t:"進行式的問句", en:"Present Progressive: Questions",
  head:["問句類型","順序","例句"],
  rows:[["Yes/No 問句","<b>be</b> + 主詞 + -ing ?","Is it raining?"],
        ["短答","—","Yes, it is. / No, it isn't."],
        ["Where 問句","<b>Where</b> + be + 主詞 + -ing ?","Where is Lily sitting?"]],
  pts:["把 <b>be 搬到主詞前面</b>就變成問句，跟 be 動詞問句一樣（見 2-1）。",
       "<b>不可以用 Do / Does</b> 造進行式問句。",
       "短答用 be，不重複 -ing 的動詞。"],
  ex:[["Are you listening to me? — Yes, I am.","你在聽我說話嗎？——我在聽。"],
      ["Is it raining? — No, it isn't.","正在下雨嗎？——沒有。"],
      ["Where is Lily sitting? — Next to Jack.","Lily 坐在哪裡？——在 Jack 旁邊。"]],
  err:[["Do you listening?","Are you listening?","進行式問句用 be"]]},

 {ch:"4-5", t:"現在簡單式 vs 現在進行式", en:"Simple Present vs. Present Progressive",
  head:["","現在簡單式","現在進行式"],
  rows:[["意思","<b>習慣</b>：每天固定做","<b>此刻</b>：正在做"],
        ["形式","原形 / 動詞 + s","be + 動詞-ing"],
        ["時間詞","every day, every morning, always, usually","now, right now, Look!, Listen!"],
        ["例句","I eat breakfast every morning.","I am eating breakfast now."]],
  pts:["判斷方法：先找句子裡的<b>時間詞</b>，就知道要用哪一種。",
       "看到 every / always / usually / never → <b>簡單式</b>。",
       "看到 now / right now / Look! / Listen! / Shh! → <b>進行式</b>。"],
  ex:[["Every night I sleep at ten.（習慣）","我每天晚上十點睡覺。"],
      ["Shh! The baby is sleeping.（此刻）","噓！寶寶正在睡覺。"],
      ["Look! A bus is coming.（此刻）","看！公車來了。"]],
  err:[["Every day I am eating breakfast.","Every day I eat breakfast.","every day 用簡單式"],
       ["Look! It rains.","Look! It's raining.","Look! 用進行式"]]},

 {ch:"4-6", t:"非動作動詞不用進行式", en:"Non-Action Verbs Not Used in the Present Progressive",
  head:["類別","常見的字"],
  rows:[["喜好","like, love, hate, want, need"],
        ["想法","know, understand, think（認為）, believe"],
        ["擁有","have（擁有）, own, belong"],
        ["感官","hear, see, smell, taste"]],
  pts:["這些字表示<b>狀態</b>而不是動作，所以<b>不加 -ing</b>。",
       "狀態沒辦法「正在進行」——你不會「正在喜歡」，喜歡就是喜歡。",
       "<b>have</b> 要小心：表示「擁有」不加 ing；但表示「吃、進行」可以：I'm having lunch.（○）"],
  ex:[["I like ice cream.（不是 I am liking）","我喜歡冰淇淋。"],
      ["She wants a new bike.","她想要一台新腳踏車。"],
      ["I know the answer.","我知道答案。"]],
  err:[["I am liking ice cream.","I like ice cream.","like 不加 ing"],
       ["She is wanting a bike.","She wants a bike.","want 不加 ing"]]},

 {ch:"4-7", t:"see / look at / watch、hear / listen to", en:"See, Look At, Watch, Hear, and Listen To",
  head:["動詞","意思","是否刻意","例句"],
  rows:[["<b>see</b>","看見（自然映入眼簾）","不刻意","I see a bird in the tree."],
        ["<b>look at</b>","看（刻意把眼睛轉過去）","刻意","I'm looking at the board."],
        ["<b>watch</b>","看（會動的、持續一段時間）","刻意","I'm watching TV."],
        ["<b>hear</b>","聽見（聲音自己傳進耳朵）","不刻意","I hear a noise."],
        ["<b>listen to</b>","聽（專心去聽）","刻意","I'm listening to music."]],
  pts:["<b>see</b> 和 <b>hear</b> 是非動作動詞（見 4-6），通常<b>不加 -ing</b>。",
       "look at 和 listen to <b>不能漏掉 at 和 to</b>。",
       "看電視、看球賽、看電影這種<b>會動</b>的東西用 <b>watch</b>；看黑板、看照片這種<b>不動</b>的用 look at。"],
  ex:[["I'm watching TV.","我正在看電視。"],
      ["I'm listening to music.","我正在聽音樂。"],
      ["I see a bird in the tree.","我看見樹上有一隻鳥。"]],
  err:[["I'm listening music.","I'm listening to music.","不能漏掉 to"],
       ["I'm seeing a bird.","I see a bird.","see 不加 ing"]]},

 {ch:"4-8", t:"think about 和 think that", en:"Think About and Think That",
  head:["用法","意思","例句"],
  rows:[["think <b>about</b> + 名詞","腦中正在想某人某事","I'm thinking about my family."],
        ["think <b>that</b> + 句子","認為、覺得（表達意見）","I think that grammar is fun."]],
  pts:["<b>think about</b> 是腦中的動作，可以用進行式：I <b>am thinking about</b> …",
       "<b>think that</b> 是表達意見，是狀態，<b>不用進行式</b>：I think that…（不是 I am thinking that…）",
       "口語中 <b>that 常常省略</b>：I think grammar is fun."],
  ex:[["I'm thinking about my family.","我正在想我的家人。"],
      ["I think (that) grammar is fun.","我覺得文法很有趣。"],
      ["I'm thinking about my test.","我正在想我的考試。"]],
  err:[["I'm thinking that grammar is fun.","I think that grammar is fun.","表達意見不用進行式"],
       ["I'm thinking my family.","I'm thinking about my family.","不能漏掉 about"]]}
]}
],

errors:[
 {t:"is / are 用錯", ch:"1-1, 1-2, 1-4", tip:"先數主詞是<b>一個</b>還是<b>很多個</b>。名詞字尾有 s 通常就是複數。",

 {t:"a / an 用錯", ch:"1-3", tip:"看後面那個字<b>開頭的發音</b>：母音 a, e, i, o 用 <b>an</b>，其他用 <b>a</b>。",

 {t:"am not 想縮寫", ch:"1-6, 2-2", tip:"英文<b>沒有 amn't 這個字</b>，唯一寫法是 <b>I'm not</b>。",

 {t:"Yes 短答亂縮寫", ch:"2-2", tip:"回答 <b>Yes</b> 時<b>不能縮寫</b>；回答 <b>No</b> 才可以。",

 {t:"have / has 用錯", ch:"2-4", tip:"主詞是<b>一個人或一樣東西</b>就用 <b>has</b>，其他都用 have。",
  cmp:[["She have a car.","She has a car.","she 用 has"],
       ["I has a pen.","I have a pen.","I 用 have"],
       ["Jack and Tom has trucks.","Jack and Tom have trucks.","兩個人用 have"]]},

 {t:"this / that / these / those 混淆", ch:"2-6, 2-7", tip:"<b>近單</b> this、<b>近複</b> these、<b>遠單</b> that、<b>遠複</b> those。單數配 is，複數配 are。",
  cmp:[["This are my books.","These are my books.","很多本要用 these"],
       ["Those book are new.","Those books are new.","名詞也要加 s"],
       ["Their are my shoes.","Those are my shoes.","their 是「他們的」"]]},

 {t:"第三人稱動詞忘了加 s", ch:"3-1, 3-4, 3-5, 3-6", tip:"主詞是 <b>he / she / it</b> 或一個人名時，動詞一定要變化。四種變法：加 s、加 es、y 變 ies、不規則。",
  cmp:[["She eat breakfast.","She eats breakfast.","一般加 s"],
       ["He teachs English.","He teaches English.","-ch 加 es"],
       ["He crys.","He cries.","子音 + y → ies"],
       ["She haves a car.","She has a car.","have 是不規則"]]},

 {t:"用了 does / doesn't 還加 s", ch:"3-8, 3-9", tip:"<b>s 只能出現一次</b>。s 跑到 does 上面了，後面的動詞就要回原形。",

       ["Does she works here?","Does she work here?","Does 後面用原形"],

 {t:"次數副詞放錯位置", ch:"3-3", tip:"口訣：<b>be 後面、一般動詞前面</b>。",

 {t:"be 動詞的句子誤用 do", ch:"2-1, 3-9", tip:"主要動詞是 <b>be</b> 的時候，否定和問句都<b>直接用 be</b>，不借 do 幫忙。",

 {t:"簡單式和進行式搞混", ch:"4-5", tip:"先找<b>時間詞</b>：every / always → 簡單式；now / Look! / Shh! → 進行式。",

 {t:"-ing 拼錯", ch:"4-2", tip:"三種常錯：字尾 e 沒去掉、該重複沒重複、不該重複卻重複了。",

function applyData(d){
  if(typeof d.stars==='number') S.stars=d.stars;
  if(typeof d.shuffle==='boolean') S.shuffle=d.shuffle;
  if(d.stats) S.stats=d.stats;
  if(d.wrong) S.wrong=d.wrong;
  if(d.runState) S.runState=d.runState;
  if(d.lastExport) S.lastExport=d.lastExport;
  if(Array.isArray(d.vocabLists)) S.vocabLists=d.vocabLists;
  if(d.vocabDone) S.vocabDone=d.vocabDone;
  if(d.vocabWrong) S.vocabWrong=d.vocabWrong;
  if(d.wsDone) S.wsDone=d.wsDone;
  if(d.wsWrong) S.wsWrong=d.wsWrong;
  if(d.savedAt) S.lastSaved=Date.parse(d.savedAt)||Date.now();
  if(d.done) UNITS.forEach(u=>SETS.forEach(t=>{
    if(d.done[u.id]&&d.done[u.id][t]) Object.assign(S.done[u.id][t], d.done[u.id][t]);
  }));
}
/* 合併：星星取較高、完成過的保留、統計相加、錯題聯集 */
function mergeData(d){
  if(typeof d.stars==='number') S.stars=Math.max(S.stars,d.stars);
  if(d.done) UNITS.forEach(u=>SETS.forEach(t=>{
    const src=d.done[u.id]&&d.done[u.id][t]; if(!src) return;
    ['teach','quiz','match','fill'].forEach(k=>{ if(src[k]) S.done[u.id][t][k]=true; });
  }));
  if(d.stats) Object.keys(d.stats).forEach(ch=>{
    if(!S.stats[ch]) S.stats[ch]={right:0,wrong:0};
    S.stats[ch].right+=d.stats[ch].right||0;
    S.stats[ch].wrong+=d.stats[ch].wrong||0;
  });
  if(d.wrong) Object.keys(d.wrong).forEach(id=>{
    if(S.wrong[id]) S.wrong[id].n=Math.max(S.wrong[id].n,d.wrong[id].n||1);
    else S.wrong[id]=d.wrong[id];
  });
  if(Array.isArray(d.vocabLists)) d.vocabLists.forEach(l=>{
    if(!S.vocabLists.some(x=>x.id===l.id)) S.vocabLists.push(l);
  });
  if(d.vocabDone) Object.keys(d.vocabDone).forEach(k=>{
    S.vocabDone[k]=S.vocabDone[k]||{cards:false,listen:false,spell:false};
    ['cards','listen','spell'].forEach(a=>{ if(d.vocabDone[k][a]) S.vocabDone[k][a]=true; });
  });
  if(d.vocabWrong) Object.keys(d.vocabWrong).forEach(k=>{
    if(!S.vocabWrong[k]) S.vocabWrong[k]=d.vocabWrong[k];
  });
  if(d.wsDone) Object.keys(d.wsDone).forEach(k=>{
    S.wsDone[k]=S.wsDone[k]||{};
    Object.keys(d.wsDone[k]).forEach(pk=>{ if(d.wsDone[k][pk]) S.wsDone[k][pk]=true; });
  });
  if(d.wsWrong) Object.keys(d.wsWrong).forEach(k=>{
    if(!S.wsWrong[k]) S.wsWrong[k]=d.wsWrong[k];
  });
}
function load(){

}
function fmtTime(ts){
  if(!ts) return '—';
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!window.speechSynthesis||!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
    u.lang='en-US'; u.rate=0.72; u.pitch=1.15;
    if(!VOICES.length) loadVoices();
    const v=VOICES.find(v=>/en[-_]US/i.test(v.lang))||VOICES.find(v=>/^en/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let AC=null;
function tone(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    (ok?[660,880,1180]:[300,200]).forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

function el(tag,cls,html){ const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripTags(s){ return String(s==null?'':s).replace(/<[^>]*>/g,''); }

}
function confetti(){
  const e=['⭐','🎉','✨','🌟','🎊','💛'];
  for(let i=0;i<24;i++){
    const d=el('div','conf',e[Math.floor(Math.random()*e.length)]);
    d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    d.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600);
  }
}

function pct(u){

}

const SPOS={'in':[100,75],'on':[100,31],'above':[100,10],'under':[100,119],'next to':[164,75],'behind':[86,50]};
function sceneHTML(rel){
  if(rel==='between'){
    return '<div class="scene">'+
      '<div class="sbox" style="left:8px;top:48px;width:62px"></div>'+
      '<div class="sbox" style="left:130px;top:48px;width:62px"></div>'+
      '<div class="sball" style="left:100px;top:75px;z-index:2">⚽</div></div>';
  }
  const p=SPOS[rel]||SPOS['in'], back=(rel==='behind');
  return '<div class="scene">'+
    (back?'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:0">⚽</div>':'')+
    '<div class="sbox" style="left:60px;top:48px"></div>'+
    (back?'':'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:2">⚽</div>')+
    '</div>';
}
function qSentence(q,ans){ return ((q.a?q.a+' ':'')+ans+' '+(q.b||'')).replace(/\s+/g,' ').trim(); }

/* 記錄答題結果 */
function record(q,right){
  if(!S.stats[q.ch]) S.stats[q.ch]={right:0,wrong:0};
  S.stats[q.ch][right?'right':'wrong']++;
  if(right){ if(S.wrong[q.id]) delete S.wrong[q.id]; }
  else S.wrong[q.id]={ch:q.ch, sent:qSentence(q,'____'), ans:q.o[q.k], zh:q.zh, n:((S.wrong[q.id]||{}).n||0)+1};
  save();
}
function wrongList(){ return Object.keys(S.wrong).map(id=>Object.assign({id}, S.wrong[id])); }
function wrongQuestionsFor(unitId){
  const out=[];
  const u=unitById(unitId);
  SETS.forEach(t=>u.sets[t].quiz.forEach(q=>{ if(S.wrong[q.id]) out.push(q); }));
  return out;
}

/* =========================================================
   選一選
   ========================================================= */
let run=null;
function allWrongQuestions(){
  const out=[];
  UNITS.forEach(u=>SETS.forEach(t=>u.sets[t].quiz.forEach(q=>{ if(S.wrong[q.id]) out.push(q); })));
  return out;
}
function buildRun(u){
  let qs;
  if(S.reviewMode){
    if(S.reviewCh) qs=allWrongQuestions().filter(q=>q.ch===S.reviewCh);
    else if(S.reviewFrom==='wb') qs=allWrongQuestions();
    else qs=wrongQuestionsFor(u.id);
  } else qs=u.sets[S.set].quiz;
  if(!qs.length) qs=u.sets[S.set].quiz;
  if(S.shuffle) qs=shuffle(qs);
  const list=qs.map(q=>{
    let opts=q.o.map((t,i)=>({t,ok:i===q.k}));
    if(S.shuffle) opts=shuffle(opts);
    return {q, opts, k:opts.findIndex(o=>o.ok)};
  });
  return {list, i:0, got:0, picked:null, unit:u.id, review:S.reviewMode, ch:S.reviewCh||null, resumed:false};
}
/* ---- 做到一半也保存：記下題目順序、選項順序、做到第幾題 ---- */
function qById(id){
  for(const u of UNITS) for(const t of SETS){
    const q=u.sets[t].quiz.find(x=>x.id===id); if(q) return q;
  }
  return null;
}
function saveRun(){
  if(!run){ S.runState=null; save(); return; }
  S.runState={unit:run.unit, set:S.set, review:run.review, ch:run.ch,
    i:run.i, got:run.got, ids:run.list.map(x=>x.q.id), opts:run.list.map(x=>x.opts.map(o=>o.t))};
  save();
}
function clearRun(){ S.runState=null; save(); }
function restoreRun(u){
  const r=S.runState;
  if(!r||!r.ids||!r.ids.length) return null;
  if(r.unit!==u.id) return null;
  if(r.review!==S.reviewMode) return null;
  if((r.ch||null)!==(S.reviewCh||null)) return null;
  if(!S.reviewMode && r.set!==S.set) return null;
  if(!(r.i>0)) return null;                      // 第一題就離開，不算進度
  const list=[];
  for(let i=0;i<r.ids.length;i++){
    const q=qById(r.ids[i]); if(!q) return null;
    const correct=q.o[q.k];
    const opts=(r.opts[i]||[]).map(t=>({t, ok:t===correct}));
    const k=opts.findIndex(o=>o.ok);
    if(k<0||opts.length!==q.o.length) return null;
    list.push({q, opts, k});
  }
  return {list, i:Math.min(r.i,list.length-1), got:r.got||0, picked:null,
          unit:u.id, review:r.review, ch:r.ch||null, resumed:true};
}
function quizBack(){
  run=null;
  if(S.reviewMode && S.reviewFrom==='wb'){ S.reviewMode=false; S.reviewCh=null; S.reviewFrom=null; go('wrongbook'); }
  else { S.reviewMode=false; S.reviewCh=null; go('unit'); }
}

  const u=unitById(S.unit);
  if(!run||run.unit!==u.id||run.review!==S.reviewMode||run.ch!==(S.reviewCh||null)){
    run=restoreRun(u)||buildRun(u);
  }
  const item=run.list[run.i], q=item.q;
  app.innerHTML=''; bankwrap.innerHTML='';
  const ttl = S.reviewMode ? ('錯題複習'+(S.reviewCh?' · 課本 '+S.reviewCh:'')) : ('選一選 '+S.set+'卷 · '+u.name);
  app.appendChild(topbar(ttl,quizBack));

  app.appendChild(el('div','qhead',
    '<span>第 '+(run.i+1)+' / '+run.list.length+' 題</span><span>答對 '+run.got+' 題</span>'));

  if(run.resumed){
    const bar=el('div','resume');
    bar.innerHTML='<span>💾 已接續上次做到的第 '+(run.i+1)+' 題</span>';
    const rb=el('button','','重新開始');
    rb.onclick=()=>{ clearRun(); run=buildRun(u); render(); };
    bar.appendChild(rb);
    app.appendChild(bar);
  }

  const filled=run.picked!==null;
  const card=el('div','qcard');
  card.innerHTML=
    (q.ch?'<div class="chtag">課本 '+q.ch+'</div>':'')+
    (q.scene?sceneHTML(q.scene):'<div class="pic emo">'+q.pic+'</div>')+
    '<div class="sent">'+(q.a?q.a+' ':'')+
      '<span class="blank'+(filled?' filled':'')+'" style="border-color:'+(filled?'var(--good)':u.hex)+'">'+
        (filled?item.opts[item.k].t:'____')+'</span> '+(q.b||'')+'</div>'+
    '<div class="zh">'+q.zh+'</div>';
  app.appendChild(card);

  const opts=el('div','opts');
  item.opts.forEach((o,n)=>{
    const b=el('button','opt',o.t);
    if(filled){
      if(n===item.k) b.classList.add('ok');
      else if(n===run.picked) b.classList.add('no');
      else b.classList.add('dim');
    }
    b.onclick=()=>{
      if(run.picked!==null) return;
      run.picked=n;
      const right=(n===item.k);
      if(right){ run.got++; addStars(1); tone(true); } else tone(false);
      record(q,right);
      saveRun();
      render();
      speak(qSentence(q,item.opts[item.k].t));
    };
    opts.appendChild(b);
  });
  app.appendChild(opts);

  if(filled){
    const ok=(run.picked===item.k);
    app.appendChild(el('div','fb '+(ok?'ok':'no'),
      (ok?'🎉 答對了！＋1 顆星　':'💪 再看一次：')+q.why));
    const nav=el('div','nav'); nav.style.marginTop='13px';
    const sp=el('button','btn','🔊 再聽一次');
    sp.onclick=()=>speak(qSentence(q,item.opts[item.k].t));
    const last=(run.i===run.list.length-1);
    const nx=el('button','btn pri',(last?'看成績 🎉':'下一題 →'));
    nx.style.background=u.hex;
    nx.onclick=()=>{
      if(last){
        const g=run.got, t=run.list.length, rev=run.review; run=null; clearRun();
        if(rev){ quizBack(); }
        else finish(u,'quiz',2,'你答對了 '+g+' / '+t+' 題！');
      } else { run.i++; run.picked=null; run.resumed=false; saveRun(); render(); }
    };
    nav.appendChild(sp); nav.appendChild(nx);
    app.appendChild(nav);
  }
}

/* =========================================================
   拖曳引擎
   ========================================================= */
let drag=null, selected=null;
function makeDraggable(chip){
  chip.addEventListener('pointerdown', e=>{
    if(chip.classList.contains('used')) return;
    e.preventDefault();
    const r=chip.getBoundingClientRect();
    drag={chip,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null};
    window.addEventListener('pointermove',onMove,{passive:false});
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
  });
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)<9) return;
  e.preventDefault();
  if(!drag.moved){
    drag.moved=true;
    const g=drag.chip.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('sel','used');
    g.style.width=drag.w+'px'; g.style.height=drag.h+'px';
    document.body.appendChild(g); drag.ghost=g;
    drag.chip.classList.add('dragging'); clearSelect();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';
  drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const s=slotAt(e.clientX,e.clientY);
  document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
  if(s) s.classList.add('hot');
}
function onUp(e){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  if(!drag) return;
  const chip=drag.chip, moved=drag.moved;
  if(moved){
    if(drag.ghost) drag.ghost.remove();
    chip.classList.remove('dragging');
    document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
    const s=slotAt(e.clientX,e.clientY);
    drag=null; if(s) tryDrop(chip,s);
  } else {
    drag=null;
    if(selected===chip) clearSelect();
    else { clearSelect(); selected=chip; chip.classList.add('sel'); speak(chip.dataset.word); }
  }
}
function clearSelect(){ if(selected){ selected.classList.remove('sel'); selected=null; } }
function slotAt(x,y){
  const t=document.elementFromPoint(x,y); if(!t) return null;
  const s=t.closest('.slot,.islot');
  return (!s||s.classList.contains('done'))?null:s;
}
function bindSlot(s){
  s.addEventListener('click',()=>{
    if(s.classList.contains('done')) return;
    if(selected){ const c=selected; clearSelect(); tryDrop(c,s); }
  });
}
let gameState=null;
function tryDrop(chip,slot){
  if(!gameState) return;
  if(chip.dataset.word===slot.dataset.key){
    slot.textContent=chip.dataset.word; slot.classList.add('done'); slot.classList.remove('wrong');
    chip.classList.add('used');
    gameState.left--; addStars(1); tone(true); speak(gameState.speakFor(slot));
    if(gameState.left<=0) setTimeout(gameState.onWin,650);
  } else {
    slot.classList.add('wrong'); tone(false);
    setTimeout(()=>slot.classList.remove('wrong'),450);
  }
}
function buildBank(words,hex){
  bankwrap.innerHTML='';
  const b=el('div','bank');
  shuffle(words).forEach(w=>{
    const c=el('div','chip',w); c.dataset.word=w; c.style.background=hex;
    makeDraggable(c); b.appendChild(c);
  });
  bankwrap.appendChild(b); return b;
}

function isCustom(id){ return (S.vocabLists||[]).some(l=>l.id===id); }
function vWords(l){
  const w=l.words||[];
  return (S.vMarkOnly && w.some(x=>x.mark)) ? w.filter(x=>x.mark) : w;
}
function vKey(listId,en){ return listId+'::'+en; }
function vRecord(listId,w,right){
  const k=vKey(listId,w.en);
  if(right){ if(S.vocabWrong[k]) delete S.vocabWrong[k]; }
  else S.vocabWrong[k]={list:listId, en:w.en, zh:w.zh, n:((S.vocabWrong[k]||{}).n||0)+1};
  save();
}
function vDone(id){ return S.vocabDone[id]||(S.vocabDone[id]={cards:false,listen:false,spell:false}); }
function vFinish(l,act,bonus,msg){
  const d=vDone(l.id), first=!d[act];
  d[act]=true;
  if(first) addStars(bonus); else save();
  doneInfo={u:{name:l.name,hex:'#3b6ea8',badge:'🎖️'}, bonus:first?bonus:0, msg,
            unitBadge:(d.cards&&d.listen&&d.spell), back:()=>go('vlist',{vid:l.id})};
  go('vdone'); confetti(); tone(true);
}

/* ---------- 拼字 ---------- */
function gapCount(word){
  const n=word.replace(/[^a-zA-Z]/g,'').length;
  return n<=4?1:(n<=6?2:(n<=8?3:4));
}
function makeSpell(w){
  const chars=w.en.split('');
  const idx=chars.map((c,i)=>({c,i})).filter(x=>/[a-zA-Z]/.test(x.c)).map(x=>x.i);
  const gaps=shuffle(idx).slice(0,Math.min(gapCount(w.en),idx.length)).sort((a,b)=>a-b);
  return {chars, gaps, filled:[], letters:shuffle(gaps.map(i=>chars[i]))};
}
function renderVspell(){
  const l=listById(S.vid); if(!l){ go('vocab'); return; }
  if(!vrun||vrun.list_id!==l.id||vrun.mode!=='spell') vrun=buildVrun(l,'spell');
  const w=vrun.list[vrun.i];
  if(!vrun.sp) vrun.sp=makeSpell(w);
  const sp=vrun.sp;
  app.innerHTML=''; bankwrap.innerHTML='';
  app.appendChild(topbar('拼字 · '+l.name,()=>{vrun=null;go('vlist',{vid:l.id});}));
  app.appendChild(el('div','qhead',
    '<span>第 '+(vrun.i+1)+' / '+vrun.list.length+' 題</span><span>答對 '+vrun.got+' 個</span>'));

  const done=(sp.filled.length===sp.gaps.length);
  const card=el('div','qcard');
  card.innerHTML='<div class="zh" style="font-size:20px;color:var(--ink);font-weight:800">'+esc(w.zh)+'</div>';
  const bl=el('div','blanks');
  sp.chars.forEach((c,i)=>{
    const gi=sp.gaps.indexOf(i);
    if(gi<0){ bl.appendChild(el('div','bl'+(/\s/.test(c)?' sp':''), /\s/.test(c)?'':esc(c))); }
    else{
      const got=sp.filled[gi];
      const d=el('div','bl gap'+(got?'':'')+((!got&&gi===sp.filled.length)?' next':''), got?esc(got):'');
      if(got){ d.classList.remove('gap'); d.textContent=got; }
      bl.appendChild(d);
    }
  });
  card.appendChild(bl);
  const sb=el('button','speak','🔊　聽發音');
  sb.style.marginTop='10px';
  sb.onclick=()=>speak(w.en);
  card.appendChild(sb);
  app.appendChild(card);

  if(!done){
    const lt=el('div','letters');
    sp.letters.forEach((c,n)=>{
      const b=el('button','lt'+(sp.usedIdx&&sp.usedIdx.indexOf(n)>=0?' used':''),esc(c));
      b.onclick=()=>{
        const need=sp.chars[sp.gaps[sp.filled.length]];
        if(c===need){
          sp.filled.push(c);
          sp.usedIdx=(sp.usedIdx||[]).concat([n]);
          tone(true);
          if(sp.filled.length===sp.gaps.length){
            vrun.got++; addStars(1); vRecord(l.id,w,!sp.missed); speak(w.en);
          }
          render();
        } else {
          sp.missed=true; tone(false);
          const g=app.querySelectorAll('.bl.gap.next')[0];
          if(g){ g.classList.add('wrong'); setTimeout(()=>g.classList.remove('wrong'),450); }
        }
      };
      lt.appendChild(b);
    });
    app.appendChild(lt);
    app.appendChild(el('div','hintline','點字母，把空格從左到右填滿'));
  } else {
    app.appendChild(el('div','fb ok','🎉 拼對了！　<b>'+esc(w.en)+'</b>　'+esc(w.zh)));
    const last=(vrun.i===vrun.list.length-1);
    const nav=el('div','nav'); nav.style.marginTop='13px';
    const nx=el('button','btn pri',(last?'看成績 🎉':'下一個 →'));
    nx.style.background='#3b6ea8';
    nx.onclick=()=>{
      if(last){ const g=vrun.got,t=vrun.list.length; vrun=null; vFinish(l,'spell',3,'你拼對了 '+g+' / '+t+' 個！'); }
      else { vrun.i++; vrun.sp=null; render(); }
    };
    nav.appendChild(nx); app.appendChild(nav);
  }
}

function wsFor(listId){ return WORKSHEETS.filter(w=>w.listId===listId); }
function wsById(id){ return WORKSHEETS.find(w=>w.id===id); }
function wsDone(id){ return S.wsDone[id]||(S.wsDone[id]={}); }
function wsPartDone(wsId,pi){ return !!wsDone(wsId)['p'+pi]; }
function wsAllDone(ws){ return ws.parts.every((p,i)=>wsPartDone(ws.id,i)); }
function wsWrongOf(wsId){

    const dn=wsPartDone(ws.id,pi);

      p.t.replace('Part ','P')+'</div>'+

function wsItems(ws,pi){
  if(pi<0){
    const ids=wsWrongOf(ws.id).map(w=>w.id);

    ws.parts.forEach((p,i)=>p.items.forEach(it=>{ if(ids.indexOf(it.id)>=0) out.push({it,p,pi:i}); }));

  }
  return ws.parts[pi].items.map(it=>({it, p:ws.parts[pi], pi}));
}

/* ---------- 老師自建單字表 ---------- */
function parseWords(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let s=line.trim();
    if(!s) return;
    s=s.replace(/^\(?\d{1,3}\)?\s*[.、,)：:]?\s*/,'');        // 去掉開頭編號
    let en='', zh='';
    const m=s.match(/[㐀-鿿　-〿＀-￯]/);
    if(m && m.index>0){ en=s.slice(0,m.index); zh=s.slice(m.index); }
    else{
      const p=s.split(/\t|,|，|\s{2,}|\s[-–—]\s/);
      if(p.length>=2){ en=p[0]; zh=p.slice(1).join(' '); } else return;
    }
    en=en.replace(/[-–—:：=,，、\s]+$/,'').trim();
    zh=zh.replace(/^[-–—:：=,，、\s]+/,'').trim();
    if(en && zh && /[a-zA-Z]/.test(en)) out.push({en,zh});
  });
  return out;
}

const P={list:[], i:0, shown:false};
function startProj(unitId,set){
  const u=unitById(unitId);
  P.list=u.sets[set].quiz.slice(); P.i=0; P.shown=false; P.u=u; P.set=set;
  projEl.classList.add('on'); drawProj();
}
function drawProj(){
  const q=P.list[P.i];
  projEl.innerHTML='';
  const ph=el('div','ph','<span>'+P.u.no+' · '+P.set+'卷　課本 '+q.ch+'</span><span>第 '+(P.i+1)+' / '+P.list.length+' 題</span>');
  projEl.appendChild(ph);
  const body=el('div','pbody');
  body.innerHTML=
    (q.scene?sceneHTML(q.scene):'<div class="ppic emo">'+q.pic+'</div>')+
    '<div class="psent">'+(q.a?q.a+' ':'')+'<u>'+(P.shown?q.o[q.k]:'　　　　')+'</u> '+(q.b||'')+'</div>'+
    '<div class="pzh">'+q.zh+'</div>';
  const po=el('div','popts');
  q.o.forEach((o,i)=>po.appendChild(el('div','popt'+(P.shown&&i===q.k?' ok':''),o)));
  body.appendChild(po);
  if(P.shown) body.appendChild(el('div','pwhy','💡 '+q.why));
  projEl.appendChild(body);

  const pf=el('div','pf');
  const prev=el('button','','← 上一題'); prev.disabled=(P.i===0);
  prev.onclick=()=>{P.i--;P.shown=false;drawProj();};
  const sp=el('button','','🔊 唸出來');
  sp.onclick=()=>speak(qSentence(q,q.o[q.k]));
  const rev=el('button','pri',P.shown?'蓋回答案':'公布答案');
  rev.onclick=()=>{P.shown=!P.shown; drawProj(); if(P.shown) speak(qSentence(q,q.o[q.k]));};
  const next=el('button','',P.i===P.list.length-1?'結束':'下一題 →');
  next.onclick=()=>{ if(P.i===P.list.length-1){ projEl.classList.remove('on'); projEl.innerHTML=''; }
                     else {P.i++;P.shown=false;drawProj();} };
  const close=el('button','','✕ 離開');
  close.onclick=()=>{ projEl.classList.remove('on'); projEl.innerHTML=''; };
  [prev,sp,rev,next,close].forEach(b=>pf.appendChild(b));
  projEl.appendChild(pf);
}

const LET=['A','B','C','D'];
/* 紙本用的介系詞圖（SVG，列印時看得到球和盒子的相對位置） */
const PSPOS={'in':[65,49],'on':[65,20],'above':[65,5],'under':[65,78],'next to':[107,49],'behind':[57,38]};
function printScene(rel){
  const box=(x)=>'<rect x="'+x+'" y="31" width="52" height="36" rx="5" fill="#f8e8ce" stroke="#333" stroke-width="2.5"/>';
  const ball=(cx,cy)=>'<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#fff" stroke="#333" stroke-width="2.5"/>'+
    '<path d="M'+(cx-11)+' '+cy+' h22 M'+cx+' '+(cy-11)+' v22" stroke="#333" stroke-width="1.6"/>';
  let inner;
  if(rel==='between') inner=box(6)+box(72)+ball(65,49);
  else {
    const p=PSPOS[rel]||PSPOS['in'];
    inner=(rel==='behind') ? ball(p[0],p[1])+box(39) : box(39)+ball(p[0],p[1]);
  }
  return '<svg width="130" height="100" viewBox="0 0 130 100" style="vertical-align:middle;margin:2px 8px">'+inner+'</svg>';
}
function buildPrint(unitId,set){
  const u=unitById(unitId), s=u.sets[set];
  let h='<div class="sheet">';
  h+='<h1>快樂學英文　'+u.no+'　'+esc(u.name)+'　【'+set+' 卷】</h1>';
  h+='<div style="font-size:12.5px;color:#444;margin-bottom:6px">'+esc(u.en)+'　／　'+stripTags(u.rule)+'</div>';
  h+='<div class="meta"><span>姓名：____________</span><span>班級：__________</span><span>日期：____ / ____</span><span>分數：________</span></div>';

  h+='<h2>一、選擇題（每題 4 分，共 48 分）</h2><ol>';
  s.quiz.forEach(q=>{
    const stem=(q.a?esc(q.a)+' ':'')+'________ '+esc(q.b||'');
    h+='<li>'+(q.scene?printScene(q.scene)+'<br>':'')+stem+
       '<span class="zhs">（'+esc(q.zh)+'）</span><br>'+
       '<span class="ops">'+q.o.map((o,i)=>'('+LET[i]+') '+esc(o)).join('　')+'</span></li>';
  });
  h+='</ol>';

  h+='<h2>二、看圖寫單字（每題 4 分，共 24 分）</h2>';
  h+='<div class="wordbank">單字庫：'+shuffle(s.match.map(m=>m.w)).map(esc).join('　／　')+'</div>';
  h+='<div class="mtab">'+s.match.map(m=>'<div class="mcell"><div class="e">'+m.pic+'</div><div class="ln"></div></div>').join('')+'</div>';

  h+='<h2>三、填空題（每題 4 分，共 24 分）</h2>';
  h+='<div class="wordbank">單字庫：'+shuffle(s.fill.map(f=>f.k)).map(esc).join('　／　')+'</div><ol>';
  s.fill.forEach(f=>{
    h+='<li>'+(f.pre?esc(f.pre)+' ':'')+'____________ '+esc(f.post)+
       '<span class="zhs">（'+esc(f.zh)+'）</span></li>';
  });
  h+='</ol></div>';

  /* 解答頁 */
  h+='<div class="sheet"><h1>解答　'+u.no+'　'+esc(u.name)+'　【'+set+' 卷】<span style="font-size:13px;font-weight:400">　教師用</span></h1>';
  h+='<h2>一、選擇題</h2><div class="key">';
  s.quiz.forEach((q,i)=>{
    h+='<div><b>'+(i+1)+'.</b> ('+LET[q.k]+') <b style="min-width:0">'+esc(q.o[q.k])+'</b>　'+
       '<span style="color:#555;font-size:13px">課本 '+q.ch+'：'+stripTags(q.why)+'</span></div>';
  });
  h+='</div><h2>二、看圖寫單字</h2><div class="key">';
  s.match.forEach((m,i)=>h+='<span style="display:inline-block;min-width:150px">'+(i+1)+'. '+m.pic+' '+esc(m.w)+'</span>');
  h+='</div><h2>三、填空題</h2><div class="key">';
  s.fill.forEach((f,i)=>h+='<div><b>'+(i+1)+'.</b> '+esc(f.k)+'　<span style="color:#555;font-size:13px">'+
    esc(((f.pre?f.pre+' ':'')+f.k+' '+f.post).replace(/\s+/g,' ').trim())+'</span></div>');
  h+='</div></div>';

  printEl.innerHTML=h;
}
