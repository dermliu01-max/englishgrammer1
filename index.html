<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>快樂學英文 · Happy English</title>
<style>
:root{
  --bg:#fff7ed;
  --ink:#3d3226;
  --soft:#7c6f62;
  --card:#ffffff;
  --u1:#ff8a3d; --u1b:#ffe6d2;
  --u2:#3fb8af; --u2b:#d5f3f1;
  --u3:#7c6cf0; --u3b:#e5e1ff;
  --u4:#ef5da8; --u4b:#ffdcef;
  --good:#2fa96b; --goodb:#dcf5e8;
  --bad:#e8543f; --badb:#ffe1dc;
  --gold:#ffc233;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%, #ffe9d6 0 90px, transparent 91px),
    radial-gradient(circle at 88% 22%, #dff5f2 0 110px, transparent 111px),
    radial-gradient(circle at 20% 88%, #ece8ff 0 100px, transparent 101px),
    radial-gradient(circle at 92% 82%, #ffe3f1 0 90px, transparent 91px);
  opacity:.7;
}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px 120px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:12px 4px;margin-bottom:6px;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(255,247,237,0));
}
.back{
  border:none;background:#fff;color:var(--ink);
  width:46px;height:46px;border-radius:16px;flex:0 0 auto;
  font-size:22px;cursor:pointer;box-shadow:0 3px 0 #e7dbcb;
}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 #e7dbcb}
.title{font-size:19px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starbox{
  display:flex;align-items:center;gap:5px;background:#fff;
  padding:9px 14px;border-radius:16px;font-weight:800;font-size:17px;
  box-shadow:0 3px 0 #e7dbcb;flex:0 0 auto;
}
.starbox .s{font-size:19px}
.starbox.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- home ---------- */
.hero{text-align:center;padding:14px 0 22px}
.hero h1{font-size:32px;margin:0 0 6px;letter-spacing:1px}
.hero p{margin:0;color:var(--soft);font-size:15px}
.hero .faces{font-size:40px;letter-spacing:2px;margin-bottom:6px}

.unitgrid{display:grid;gap:16px}
.unit{
  border:none;text-align:left;width:100%;
  background:var(--card);border-radius:var(--r);padding:18px;
  display:flex;align-items:center;gap:16px;cursor:pointer;
  box-shadow:0 5px 0 #e7dbcb;position:relative;overflow:hidden;
  font-family:inherit;color:inherit;
}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.unit .icon{
  width:74px;height:74px;flex:0 0 auto;border-radius:20px;
  display:grid;place-items:center;font-size:40px;
}
.unit .meta{flex:1;min-width:0}
.unit .no{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.75}
.unit .nm{font-size:20px;font-weight:800;margin:2px 0 3px}
.unit .en{font-size:13px;color:var(--soft);font-weight:600}
.bar{height:9px;border-radius:9px;background:#f0e7db;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.unit .badge{position:absolute;top:10px;right:12px;font-size:24px}

.shelf{background:#fff;border-radius:var(--r);padding:16px 18px;margin-top:20px;box-shadow:0 5px 0 #e7dbcb}
.shelf h3{margin:0 0 10px;font-size:16px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bg{
  width:60px;height:60px;border-radius:18px;display:grid;place-items:center;
  font-size:30px;background:#f4ece2;filter:grayscale(1);opacity:.45;
}
.bg.on{filter:none;opacity:1;background:#fff6dc;box-shadow:0 0 0 3px var(--gold) inset}

/* ---------- unit menu ---------- */
.banner{border-radius:var(--r);padding:20px;color:#fff;margin-bottom:18px;text-align:center}
.banner .bi{font-size:52px;line-height:1}
.banner h2{margin:6px 0 2px;font-size:24px}
.banner p{margin:0;opacity:.92;font-size:14px;font-weight:600}

.acts{display:grid;gap:13px}
.act{
  border:none;font-family:inherit;color:inherit;text-align:left;
  background:#fff;border-radius:var(--r);padding:16px;display:flex;
  align-items:center;gap:14px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;width:100%;
}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.act .ai{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:29px;flex:0 0 auto;background:#f6efe6}
.act .at{flex:1}
.act .at b{display:block;font-size:18px}
.act .at span{font-size:13px;color:var(--soft)}
.act .ck{font-size:24px;opacity:.25}
.act .ck.on{opacity:1}

/* ---------- teach cards ---------- */
.tcard{
  background:#fff;border-radius:26px;padding:26px 20px;text-align:center;
  box-shadow:0 6px 0 #e7dbcb;margin-bottom:16px;animation:slide .35s ease;
}
@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.chtag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:10px;background:#f4ece2;color:#8a7a68;margin-bottom:10px}
.scene{position:relative;width:200px;height:150px;margin:0 auto 8px}
.sbox{position:absolute;width:80px;height:54px;border:5px solid #c39a68;background:#f8e8ce;border-radius:10px;z-index:1;box-sizing:border-box}
.sball{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-50%)}
.tcard .pic{font-size:82px;line-height:1.15;margin-bottom:10px}
.tcard .en{font-size:29px;font-weight:800;margin-bottom:6px;line-height:1.3}
.tcard .en em{font-style:normal;color:var(--u1);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px}
.tcard .zh{font-size:18px;color:var(--soft);font-weight:600;margin-bottom:16px}
.speak{
  border:none;font-family:inherit;cursor:pointer;
  background:var(--gold);color:#5b4400;font-weight:800;font-size:17px;
  padding:13px 26px;border-radius:18px;box-shadow:0 4px 0 #d9a015;
}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a015}
.tip{background:#fff9e6;border-radius:18px;padding:14px 16px;font-size:15px;font-weight:600;line-height:1.7;box-shadow:0 4px 0 #f0e2bd;margin-bottom:16px}
.tip b{color:#c47b00}
.dots{display:flex;justify-content:center;gap:7px;margin:4px 0 16px}
.dots i{width:9px;height:9px;border-radius:50%;background:#e2d5c4}
.dots i.on{background:var(--u1);width:24px;border-radius:9px}
.nav{display:flex;gap:12px}
.btn{
  flex:1;border:none;font-family:inherit;cursor:pointer;
  padding:16px;border-radius:18px;font-size:17px;font-weight:800;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 #e7dbcb;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e7dbcb}
.btn.pri{background:var(--u1);color:#fff;box-shadow:0 4px 0 #d96c22}
.btn.pri:active{box-shadow:0 1px 0 #d96c22}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:var(--soft);margin-bottom:10px}
.qcard{background:#fff;border-radius:26px;padding:24px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb;margin-bottom:16px}
.qcard .pic{font-size:70px;margin-bottom:8px}
.qcard .sent{font-size:26px;font-weight:800;line-height:1.5;margin-bottom:6px}
.blank{display:inline-block;min-width:88px;border-bottom:5px solid var(--u1);color:transparent}
.blank.filled{color:var(--good);border-color:var(--good)}
.qcard .zh{font-size:15px;color:var(--soft);font-weight:600}
.opts{display:grid;gap:12px}
.opt{
  border:none;font-family:inherit;cursor:pointer;width:100%;
  background:#fff;padding:18px;border-radius:20px;font-size:22px;font-weight:800;
  box-shadow:0 5px 0 #e7dbcb;color:var(--ink);
}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.opt.ok{background:var(--goodb);color:var(--good);box-shadow:0 5px 0 #b6e6cf}
.opt.no{background:var(--badb);color:var(--bad);box-shadow:0 5px 0 #f7c3ba;animation:shake .4s}
.opt.dim{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{border-radius:20px;padding:15px 17px;font-size:16px;font-weight:700;line-height:1.65;margin-top:14px;animation:slide .3s ease}
.fb.ok{background:var(--goodb);color:#1d7a4b}
.fb.no{background:var(--badb);color:#b23a28}

/* ---------- drag / match / fill ---------- */
.hintline{text-align:center;font-size:14px;color:var(--soft);font-weight:700;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
@media(max-width:420px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 5px 0 #e7dbcb}
.mcard .pic{font-size:46px;line-height:1.1}
.slot{
  margin-top:9px;min-height:46px;border-radius:14px;border:3px dashed #ddd0be;
  display:grid;place-items:center;font-size:16px;font-weight:800;color:#c3b5a3;
  padding:4px 6px;word-break:break-word;
}
.slot.hot{border-color:var(--u1);background:#fff2e6;transform:scale(1.05)}
.slot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.slot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.fsent{background:#fff;border-radius:22px;padding:20px 16px;box-shadow:0 5px 0 #e7dbcb;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.fsent .pic{font-size:40px;flex:0 0 auto}
.fsent .body{flex:1}
.fsent .line{font-size:21px;font-weight:800;line-height:1.9}
.fsent .zh{font-size:13px;color:var(--soft);font-weight:600;margin-top:4px}
.islot{
  display:inline-grid;place-items:center;vertical-align:middle;
  min-width:92px;height:42px;border-radius:12px;border:3px dashed #ddd0be;
  color:#c3b5a3;font-size:18px;padding:0 8px;margin:0 3px;
}
.islot.hot{border-color:var(--u1);background:#fff2e6}
.islot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.islot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.bank{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:#fff;border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.1);
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:760px;margin:0 auto;
}
.chip{
  background:var(--u1);color:#fff;font-weight:800;font-size:19px;
  padding:13px 20px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);
  cursor:grab;touch-action:none;user-select:none;
}
.chip.sel{outline:4px solid var(--gold);transform:translateY(-4px)}
.chip.dragging{opacity:.3}
.chip.used{visibility:hidden}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.95;transform:scale(1.1) rotate(-3deg);margin:0}

/* ---------- done ---------- */
.done{background:#fff;border-radius:26px;padding:36px 22px;text-align:center;box-shadow:0 6px 0 #e7dbcb}
.done .big{font-size:78px;animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.done h2{font-size:26px;margin:10px 0 6px}
.done p{color:var(--soft);font-weight:600;margin:0 0 8px}
.done .got{font-size:34px;letter-spacing:4px;margin:12px 0 20px}

.conf{position:fixed;top:-20px;font-size:24px;z-index:900;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bankwrap"></div>

<script>
/* =========================================================
   資料：依 Basic English Grammar (Azar) 4th Ed. Ch1–4
   ========================================================= */
const UNITS = [
{
  id:1, no:"UNIT 1", name:"Be 動詞", en:"Chapter 1 · Using Be",
  emoji:"🧒", c:"--u1", cb:"--u1b", hex:"#ff8a3d", badge:"🏅",
  rule:"I 配 <b>am</b>　He / She / It 配 <b>is</b>　You / We / They 配 <b>are</b>",
  teach:[
    {ch:"1-1", pic:"🙋", en:["I ","am"," late."], zh:"我遲到了。", tip:"看到 <b>I</b> 就用 <b>am</b>，永遠不變。"},
    {ch:"1-1", pic:"👩", en:["She ","is"," late."], zh:"她遲到了。", tip:"Maria is late. → <b>She</b> is late.　「她」用 <b>is</b>。"},
    {ch:"1-1", pic:"👨", en:["He ","is"," late."], zh:"他遲到了。", tip:"Tom is late. → <b>He</b> is late.　「他」用 <b>is</b>。"},
    {ch:"1-1", pic:"🚌", en:["It ","is"," late."], zh:"它遲到了。", tip:"Bus 10 is late. → <b>It</b> is late.　東西、動物用 <b>It</b>。"},
    {ch:"1-2", pic:"👨‍👩‍👧", en:["We ","are"," here."], zh:"我們在這裡。", tip:"Sam and I ＝ <b>We</b>。兩個人以上用 <b>are</b>。"},
    {ch:"1-2", pic:"👬", en:["They ","are"," here."], zh:"他們在這裡。", tip:"Sam and Lisa ＝ <b>They</b>，用 <b>are</b>。"},
    {ch:"1-3", pic:"🍁", en:["Canada is ","a"," country."], zh:"加拿大是一個國家。", tip:"一個東西前面要加 <b>a</b>。不可以說 Canada is country。"},
    {ch:"1-3", pic:"🏝️", en:["Bali is ","an"," island."], zh:"峇里島是一座島。", tip:"開頭發 <b>a / e / i / o</b> 的音要用 <b>an</b>：an island、an animal、an ear。"},
    {ch:"1-4", pic:"🐱🐱", en:["Cats ","are"," animals."], zh:"貓是動物。", tip:"很多個 → 名詞加 <b>s</b>，動詞用 <b>are</b>：cat<b>s</b> are animal<b>s</b>。"},
    {ch:"1-5", pic:"🎒", en:["I","'m"," a student."], zh:"我是學生。", tip:"I am → <b>I'm</b>；she is → <b>she's</b>；they are → <b>they're</b>。"},
    {ch:"1-6", pic:"👨‍🚀", en:["I ","am not"," an astronaut."], zh:"我不是太空人。", tip:"要說「不是」，在 be 後面加 <b>not</b>。也可寫 <b>I'm not</b>、<b>isn't</b>、<b>aren't</b>。"},
    {ch:"1-7", pic:"⚽", en:["A ball is ","round","."], zh:"球是圓的。", tip:"be 後面可以放<b>形容詞</b>，說它長什麼樣子。"},
    {ch:"1-8", pic:"📚", en:["Bob is ","at the library","."], zh:"Bob 在圖書館。", tip:"be 後面也可以放<b>地方</b>：here、there、at work、in his room。"},
    {ch:"1-9", pic:"🧩", en:["I am ","a student","."], zh:"我是學生。", tip:"be 後面三選一：<b>名詞</b>（a student）、<b>形容詞</b>（hungry）、<b>地方</b>（in class）。"}
  ],
  quiz:[
    {ch:"1-1", pic:"🙋", a:"He", b:"here.", zh:"他在這裡。", o:["am","is","are"], k:1, why:"<b>He</b> 是一個人 → <b>is</b>。"},
    {ch:"1-1", pic:"🥵", a:"I", b:"hot.", zh:"我好熱。", o:["am","is","are"], k:0, why:"<b>I</b> 一定配 <b>am</b>。"},
    {ch:"1-2", pic:"👨‍👩‍👧", a:"We", b:"ready.", zh:"我們準備好了。", o:["am","is","are"], k:2, why:"<b>We</b> 是很多人 → <b>are</b>。"},
    {ch:"1-2", pic:"🤒", a:"They", b:"sick.", zh:"他們生病了。", o:["am","is","are"], k:2, why:"<b>They</b> → <b>are</b>。"},
    {ch:"1-3", pic:"🏝️", a:"Bali is", b:"island.", zh:"峇里島是一座島。", o:["a","an"], k:1, why:"island 開頭是母音 <b>i</b> → 用 <b>an</b>。"},
    {ch:"1-3", pic:"🐕", a:"A dog is", b:"animal.", zh:"狗是一種動物。", o:["a","an"], k:1, why:"animal 開頭是母音 <b>a</b> → 用 <b>an</b>。"},
    {ch:"1-4", pic:"🐦🐦", a:"Birds", b:"animals.", zh:"鳥是動物。", o:["is","are"], k:1, why:"Bird<b>s</b> 是很多隻 → <b>are</b>。"},
    {ch:"1-4", pic:"📖", a:"A dictionary", b:"a book.", zh:"字典是一種書。", o:["is","are"], k:0, why:"只有一本 → <b>is</b>。"},
    {ch:"1-5", pic:"🧑‍🎓", a:"Sara is a student.", b:"in my class.", zh:"Sara 是學生，她在我班上。", o:["He's","She's","It's"], k:1, why:"Sara 是女生 → she is → <b>She's</b>。"},
    {ch:"1-6", pic:"🧊", a:"Ice", b:"hot.", zh:"冰不是熱的。", o:["is","isn't"], k:1, why:"冰是冷的，要用否定 <b>isn't</b>。"},
    {ch:"1-7", pic:"🔥", a:"Fire", b:"hot.", zh:"火是燙的。", o:["is","are"], k:0, why:"Fire 是一個 → <b>is</b>；hot 是形容詞。"},
    {ch:"1-8", scene:"on", a:"The ball is", b:"the box.", zh:"球在盒子上面。", o:["in","on","under","next to"], k:1, why:"在上面而且有碰到 → <b>on</b>。"},
    {ch:"1-8", scene:"in", a:"The ball is", b:"the box.", zh:"球在盒子裡面。", o:["in","on","under","next to"], k:0, why:"在裡面 → <b>in</b>。"},
    {ch:"1-8", scene:"under", a:"The ball is", b:"the box.", zh:"球在盒子下面。", o:["in","on","under","next to"], k:2, why:"在下面 → <b>under</b>。"},
    {ch:"1-8", scene:"next to", a:"The ball is", b:"the box.", zh:"球在盒子旁邊。", o:["in","on","under","next to"], k:3, why:"在旁邊 → <b>next to</b>。"},
    {ch:"1-8", scene:"above", a:"The ball is", b:"the box.", zh:"球在盒子上方（沒碰到）。", o:["on","above","under","behind"], k:1, why:"在上方但沒碰到 → <b>above</b>；碰到才是 on。"},
    {ch:"1-8", scene:"between", a:"The ball is", b:"the boxes.", zh:"球在兩個盒子中間。", o:["behind","between","next to","above"], k:1, why:"在兩個東西中間 → <b>between</b>。"}
  ],
  match:[
    {pic:"🐱", w:"cat"},{pic:"🐶", w:"dog"},{pic:"🐦", w:"bird"},
    {pic:"🐘", w:"elephant"},{pic:"🐭", w:"mouse"},{pic:"🐔", w:"chicken"}
  ],
  fill:[
    {pic:"🚌", pre:"Bus 10", post:"late.", k:"is", zh:"十號公車遲到了。"},
    {pic:"👭", pre:"Amy and I", post:"late.", k:"are", zh:"Amy 和我遲到了。"},
    {pic:"🍁", pre:"Canada is", post:"country.", k:"a", zh:"加拿大是一個國家。"},
    {pic:"🏝️", pre:"Bali is", post:"island.", k:"an", zh:"峇里島是一座島。"},
    {pic:"🐱🐱", pre:"Cats", post:"animals.", k:"are", zh:"貓是動物。"},
    {pic:"🍋", pre:"A lemon", post:"sour.", k:"is", zh:"檸檬是酸的。"}
  ]
},
{
  id:2, no:"UNIT 2", name:"問問題・我有", en:"Chapter 2 · Using Be and Have",
  emoji:"🎒", c:"--u2", cb:"--u2b", hex:"#3fb8af", badge:"🏆",

let VOICES = [];
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices()||[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
    u.lang='en-US'; u.rate=0.72; u.pitch=1.15;
    if(!VOICES.length) loadVoices();
    const v = VOICES.find(v=>/en[-_]US/i.test(v.lang)) || VOICES.find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let AC=null;
function tone(ok){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok?[660,880,1180]:[300,200];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

const SPOS = {
  'in':      [100,75], 'on':[100,31], 'above':[100,10],
  'under':   [100,119], 'next to':[164,75], 'behind':[86,50]
};
function sceneHTML(rel){
  if(rel==='between'){
    return '<div class="scene">'+
      '<div class="sbox" style="left:8px;top:48px;width:62px"></div>'+
      '<div class="sbox" style="left:130px;top:48px;width:62px"></div>'+
      '<div class="sball" style="left:100px;top:75px;z-index:2">⚽</div></div>';
  }
  const p = SPOS[rel] || SPOS['in'];
  const back = rel==='behind';
  return '<div class="scene">'+
    (back?'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:0">⚽</div>':'')+
    '<div class="sbox" style="left:60px;top:48px"></div>'+
    (back?'':'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:2">⚽</div>')+
    '</div>';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* =========================================================
   拖曳引擎（滑鼠 + 觸控；也支援點一下選、再點一下放）
   ========================================================= */
let drag=null, selected=null;
function makeDraggable(chip){
  chip.addEventListener('pointerdown', e=>{
    if(chip.classList.contains('used')) return;
    e.preventDefault();
    const r=chip.getBoundingClientRect();
    drag={chip,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null};
    window.addEventListener('pointermove',onMove,{passive:false});
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
  });
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)<9) return;
  e.preventDefault();
  if(!drag.moved){
    drag.moved=true;
    const g=drag.chip.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('sel','used');
    g.style.width=drag.w+'px'; g.style.height=drag.h+'px';
    document.body.appendChild(g); drag.ghost=g;
    drag.chip.classList.add('dragging');
    clearSelect();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';
  drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const s=slotAt(e.clientX,e.clientY);
  document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
  if(s) s.classList.add('hot');
}
function onUp(e){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  if(!drag) return;
  const chip=drag.chip, moved=drag.moved;
  if(moved){
    if(drag.ghost) drag.ghost.remove();
    chip.classList.remove('dragging');
    document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
    const s=slotAt(e.clientX,e.clientY);
    drag=null;
    if(s) tryDrop(chip,s);
  } else {
    drag=null;
    if(selected===chip){ clearSelect(); }
    else { clearSelect(); selected=chip; chip.classList.add('sel'); speak(chip.dataset.word); }
  }
}
function clearSelect(){ if(selected){ selected.classList.remove('sel'); selected=null; } }
function slotAt(x,y){
  const t=document.elementFromPoint(x,y);
  if(!t) return null;
  const s=t.closest('.slot,.islot');
  if(!s || s.classList.contains('done')) return null;
  return s;
}
function bindSlot(s){
  s.addEventListener('click',()=>{
    if(s.classList.contains('done')) return;
    if(selected){ const c=selected; clearSelect(); tryDrop(c,s); }
  });
}

let gameState=null;
function tryDrop(chip,slot){
  if(!gameState) return;
  const word=chip.dataset.word, key=slot.dataset.key;
  if(word===key){
    slot.textContent=word; slot.classList.add('done'); slot.classList.remove('wrong');
    chip.classList.add('used');
    gameState.left--; addStars(1); tone(true); speak(gameState.speakFor(slot));
    if(gameState.left<=0) setTimeout(gameState.onWin,650);
  } else {
    slot.classList.add('wrong'); tone(false);
    setTimeout(()=>slot.classList.remove('wrong'),450);
  }
}

  const b=el('div','bank');
  shuffle(words).forEach(w=>{
    const c=el('div','chip',w); c.dataset.word=w; c.style.background=hex;
    makeDraggable(c); b.appendChild(c);
  });
  bankwrap.appendChild(b);
  return b;
}

  app.innerHTML='';
  app.appendChild(topbar('配一配 · '+u.name,()=>{gameState=null;bankwrap.innerHTML='';go('unit');}));
  app.appendChild(el('div','hintline','把下面的英文單字，拖到正確的圖片上 👇<br>（也可以先點單字，再點圖片下面的格子）'));

  const grid=el('div','mgrid');
  shuffle(u.match).forEach(m=>{
    const c=el('div','mcard');
    c.innerHTML='<div class="pic">'+m.pic+'</div>';
    const s=el('div','slot','？'); s.dataset.key=m.w; s.dataset.pic=m.pic;
    bindSlot(s); c.appendChild(s); grid.appendChild(c);
  });
  app.appendChild(grid);
  app.appendChild(el('div','',
    '<div style="height:110px"></div>'));

  buildBank(u.match.map(m=>m.w),u.hex);
  gameState={ left:u.match.length, speakFor:s=>s.dataset.key,
    onWin:()=>{ bankwrap.innerHTML=''; gameState=null; finish(u,'match',3,'全部配對成功！'); } };
}

/* =========================================================
   填一填
   ========================================================= */
function renderFill(){
  const u=UNITS.find(x=>x.id===S.unit);
  app.innerHTML='';
  app.appendChild(topbar('填一填 · '+u.name,()=>{gameState=null;bankwrap.innerHTML='';go('unit');}));
  app.appendChild(el('div','hintline','把單字拖進空格，把句子完成 👇<br>（也可以先點單字，再點空格）'));

  u.fill.forEach(f=>{
    const row=el('div','fsent');
    row.innerHTML='<div class="pic">'+f.pic+'</div>';
    const body=el('div','body');
    const line=el('div','line');
    if(f.pre) line.appendChild(document.createTextNode(f.pre+' '));
    const s=el('span','islot','？'); s.dataset.key=f.k; s.dataset.full=(f.pre?f.pre+' ':'')+f.k+' '+f.post;
    bindSlot(s); line.appendChild(s);
    line.appendChild(document.createTextNode(' '+f.post));
    body.appendChild(line);
    body.appendChild(el('div','zh',f.zh));
    row.appendChild(body);
    app.appendChild(row);
  });
  app.appendChild(el('div','','<div style="height:120px"></div>'));

  buildBank(u.fill.map(f=>f.k),u.hex);
  gameState={ left:u.fill.length, speakFor:s=>s.dataset.full,
    onWin:()=>{ bankwrap.innerHTML=''; gameState=null; finish(u,'fill',3,'句子全部完成了！'); } };
}

/* =========================================================
   完成畫面
   ========================================================= */
let doneInfo=null;
function finish(u,act,bonus,msg){
  const first=!S.done[u.id][act];
  S.done[u.id][act]=true;
  if(first) addStars(bonus); else save();
  const justFinishedUnit = unitDone(u);
  doneInfo={u,act,bonus:first?bonus:0,msg,unitBadge:justFinishedUnit};
  go('done',{unit:u.id});
  confetti(); tone(true);
}
function renderDone(){
  const {u,bonus,msg,unitBadge}=doneInfo;
  app.innerHTML=''; bankwrap.innerHTML='';
  app.appendChild(topbar('太棒了！',()=>go('unit')));
  const d=el('div','done');
  d.innerHTML =
    '<div class="big">'+(unitBadge?u.badge:'🎉')+'</div>'+
    '<h2>'+(unitBadge?'恭喜！拿到「'+u.name+'」獎章！':'做得好！')+'</h2>'+
    '<p>'+msg+'</p>'+
    '<div class="got">'+(bonus>0?'⭐'.repeat(bonus)+' ＋'+bonus:'⭐ 已完成過囉')+'</div>';
  const nav=el('div','nav');
  const a=el('button','btn','回單元');
  a.onclick=()=>go('unit');
  const b=el('button','btn pri','回首頁 🏠');
  b.style.background=u.hex; b.style.boxShadow='0 4px 0 rgba(0,0,0,.2)';
  b.onclick=()=>go('home');
  nav.appendChild(a); nav.appendChild(b);
  d.appendChild(nav);
  app.appendChild(d);
}

/* =========================================================
   路由
   ========================================================= */
function render(){
  clearSelect();
  switch(S.screen){
    case 'home': renderHome(); break;
    case 'unit': renderUnit(); break;
    case 'teach': renderTeach(); break;
    case 'quiz': renderQuiz(); break;
    case 'match': renderMatch(); break;
    case 'fill': renderFill(); break;
    case 'done': renderDone(); break;
  }
}
render();
</script>
</body>
</html>
