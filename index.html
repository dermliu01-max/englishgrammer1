/* ---- 文法講義（每章一份 A4） ---- */
function buildGrammarSheet(unitId){
  const gu=GRAMMAR.units.find(x=>x.u===unitId), u=unitById(unitId);
  let h='<div class="sheet"><h1>文法講義　'+u.no+'　'+esc(u.name)+'</h1>'+
    '<div style="font-size:12.5px;color:#444;margin-bottom:4px">'+esc(u.en)+'　／　'+
    stripTags(u.rule)+'</div>'+
    '<div class="meta"><span>姓名：____________</span><span>班級：__________</span></div>';
  gu.items.forEach(it=>{
    h+='<h2>'+it.ch+'　'+esc(it.t)+'<span style="font-weight:400;font-size:12px">　'+esc(it.en)+'</span></h2>';
    h+='<table class="gpt"><tr>'+it.head.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
    it.rows.forEach(r=>{ h+='<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>'; });
    h+='</table>';
    h+='<ul class="gpl">'+it.pts.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
    h+='<div class="gex"><b>例句</b><br>'+it.ex.map(e=>'・'+e[0]+'　<span style="color:#555">'+esc(e[1])+'</span>').join('<br>')+'</div>';
    if(it.err&&it.err.length){
      h+='<div class="gerr"><b>常見錯誤</b><br>'+it.err.map(e=>
        '✗ <s>'+e[0]+'</s>　→　✓ <b>'+e[1]+'</b>　<span style="color:#555;font-size:12px">'+esc(e[2])+'</span>').join('<br>')+'</div>';
    }
  });
  h+='</div>';
  printEl.innerHTML=h;
}
/* ---- 四章總覽 + 常見錯誤（一份） ---- */
function buildOverviewSheet(){
  let h='<div class="sheet"><h1>四章總覽對照表　Ch1–Ch4</h1>';
  h+='<div style="font-size:12.5px;color:#444;margin-bottom:12px">'+stripTags(GRAMMAR.overview.note)+'</div>';
  h+='<table class="gpt"><tr>'+GRAMMAR.overview.head.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
  GRAMMAR.overview.rows.forEach(r=>{ h+='<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>'; });
  h+='</table></div>';
  h+='<div class="sheet"><h1>常見錯誤總整理</h1>';
  GRAMMAR.errors.forEach(e=>{
    h+='<h2>'+esc(e.t)+'<span style="font-weight:400;font-size:12px">　課本 '+e.ch+'</span></h2>';
    h+='<div class="gpl" style="margin:0 0 6px 0;font-size:13.5px">💡 '+e.tip+'</div><div class="gerr">';
    e.cmp.forEach(x=>{ h+='✗ <s>'+x[0]+'</s>　→　✓ <b>'+x[1]+'</b>　<span style="color:#555;font-size:12px">'+esc(x[2])+'</span><br>'; });
    h+='</div>';
  });
  h+='</div>';
  printEl.innerHTML=h;
}
/* ---- 錯題複習卷 ---- */
function buildWrongSheet(){
  const g=wrongByCh(), chs=Object.keys(g).sort();
  let n=0, key=[];
  let h='<div class="sheet"><h1>錯題複習卷</h1>'+
    '<div class="meta"><span>姓名：____________</span><span>日期：____ / ____</span>'+
    '<span>共 '+chs.reduce((a,c)=>a+g[c].length,0)+' 題</span></div>';
  chs.forEach(ch=>{
    const found=gItemByCh(ch);
    h+='<h2>課本 '+ch+'　'+(found?esc(found.it.t):'')+'</h2><ol start="'+(n+1)+'">';
    g[ch].forEach(w=>{
      n++; key.push([n,w.ans]);
      h+='<li>'+esc(w.sent).replace('____','____________')+
         '<span class="zhs">（'+esc(w.zh)+'）</span></li>';
    });
    h+='</ol>';
  });
  h+='</div><div class="sheet"><h1>錯題複習卷　解答<span style="font-size:13px;font-weight:400">　教師用</span></h1><div class="key">';
  key.forEach(k=>h+='<span style="display:inline-block;min-width:160px"><b>'+k[0]+'.</b> '+esc(k[1])+'</span>');
  h+='</div></div>';
  printEl.innerHTML=h;
}
function doPrintWrong(){
  if(!Object.keys(S.wrong).length){ alert('目前沒有錯題，先做幾題練習吧！'); return; }
  buildWrongSheet(); setTimeout(()=>window.print(),120);
}

/* ---- 學習紀錄匯出 / 匯入 ---- */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
function exportData(){
  S.lastExport=Date.now(); save();
  const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  /* 用純英文檔名：中文檔名在部分瀏覽器下載時會被丟掉，連 .json 副檔名都不見，之後就匯不回來 */
  a.download='happy-english-progress-'+stamp()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function describe(d){
  let sets=0;
  UNITS.forEach(u=>SETS.forEach(t=>{
    const x=d.done&&d.done[u.id]&&d.done[u.id][t];
    if(x&&x.teach&&x.quiz&&x.match&&x.fill) sets++;
  }));
  return '　儲存時間：'+(d.savedAt?String(d.savedAt).slice(0,16).replace('T',' '):'未知')+
         '\n　星星：'+(d.stars||0)+' 顆'+
         '\n　完成卷數：'+sets+' / 12'+
         '\n　錯題：'+Object.keys(d.wrong||{}).length+' 題';
}
function importData(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='happy-english') throw new Error('這不是本教材的紀錄檔');
      const cur='　目前：星星 '+S.stars+' 顆、錯題 '+Object.keys(S.wrong).length+' 題';
      const ok=confirm('要匯入這份紀錄嗎？\n\n【檔案內容】\n'+describe(d)+'\n\n【這台裝置】\n'+cur+
        '\n\n按「確定」＝ 用檔案<覆蓋>目前紀錄\n按「取消」＝ 不匯入');
      if(!ok){ cb(new Error('已取消匯入')); return; }
      const merge=confirm('要保留這台裝置原本的紀錄，把兩邊<合併>起來嗎？\n\n'+
        '按「確定」＝ 合併（星星取較高、完成與錯題兩邊都保留）\n'+
        '按「取消」＝ 直接覆蓋');
      if(merge) mergeData(d); else applyData(d);
      save();
      cb(null,d.savedAt);
    }catch(e){ cb(e); }
  };
  r.onerror=()=>cb(new Error('讀取檔案失敗'));
  r.readAsText(file);
}

function renderPreview(){
  app.innerHTML=''; bankwrap.innerHTML='';
  app.appendChild(topbar('學習單預覽',()=>go('teacher')));
  const box=el('div','tsec');
  box.style.cssText+='padding:8px;overflow-x:auto';
  const inner=el('div','');
  inner.innerHTML=printEl.innerHTML;
  inner.querySelectorAll('.sheet').forEach(s=>{
    s.style.cssText='border:1px solid #e7dbcb;border-radius:12px;margin-bottom:14px;padding:18px;font-size:13px';
  });
  box.appendChild(inner); app.appendChild(box);
  const b=el('button','tgo','🖨️ 現在列印'); b.onclick=()=>window.print();
  app.appendChild(b);
}

/* =========================================================
   路由
   ========================================================= */
function render(){
  clearSelect();
  switch(S.screen){
    case 'home': renderHome(); break;
    case 'unit': renderUnit(); break;
    case 'teach': renderTeach(); break;
    case 'quiz': renderQuiz(); break;
    case 'match': renderMatch(); break;
    case 'fill': renderFill(); break;
    case 'done': renderDone(); break;
    case 'teacher': renderTeacher(); break;
    case 'preview': renderPreview(); break;
    case 'grammar': renderGrammar(); break;
    case 'gitem': renderGItem(); break;
    case 'gerrors': renderGErrors(); break;
    case 'goverview': renderGOverview(); break;
    case 'wrongbook': renderWrongBook(); break;
    case 'vocab': renderVocab(); break;
    case 'vlist': renderVList(); break;
    case 'vcards': renderVcards(); break;
    case 'vlisten': renderVlisten(); break;
    case 'vspell': renderVspell(); break;
    case 'vnew': renderVnew(); break;
    case 'vwrong': renderVwrong(); break;
    case 'vdone': renderDone(); break;
    case 'wsheet': renderWsheet(); break;
    case 'wspart': renderWspart(); break;
  }
}
render();
