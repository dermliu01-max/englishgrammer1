<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>快樂學英文 · Happy English</title>
<style>
:root{
  --bg:#fff7ed; --ink:#3d3226; --soft:#7c6f62; --card:#fff;
  --u1b:#ffe6d2; --u2b:#d5f3f1; --u3b:#e5e1ff; --u4b:#ffdcef;
  --good:#2fa96b; --goodb:#dcf5e8; --bad:#e8543f; --badb:#ffe1dc;
  --gold:#ffc233; --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
}
.emo,.pic,.icon,.bi,.ai,.bg,.big,.mcard .pic,.fsent .pic,.faces{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Android Emoji",sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%, #ffe9d6 0 90px, transparent 91px),
    radial-gradient(circle at 88% 22%, #dff5f2 0 110px, transparent 111px),
    radial-gradient(circle at 20% 88%, #ece8ff 0 100px, transparent 101px),
    radial-gradient(circle at 92% 82%, #ffe3f1 0 90px, transparent 91px);
  opacity:.7;
}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px 130px}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;padding:12px 4px 10px;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(255,247,237,0))}
.back,.tbtn{border:none;background:#fff;color:var(--ink);width:46px;height:46px;border-radius:16px;flex:0 0 auto;
  font-size:21px;cursor:pointer;box-shadow:0 3px 0 #e7dbcb;font-family:inherit}
.back:active,.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e7dbcb}
.title{font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starbox{display:flex;align-items:center;gap:5px;background:#fff;padding:9px 13px;border-radius:16px;
  font-weight:800;font-size:16px;box-shadow:0 3px 0 #e7dbcb;flex:0 0 auto}
.starbox.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

.hero{text-align:center;padding:10px 0 20px}
.hero h1{font-size:31px;margin:0 0 6px;letter-spacing:1px}
.hero p{margin:0;color:var(--soft);font-size:14px}
.hero .faces{font-size:38px;letter-spacing:2px;margin-bottom:6px}

.unitgrid{display:grid;gap:16px}
.unit{border:none;text-align:left;width:100%;background:var(--card);border-radius:var(--r);padding:18px;
  display:flex;align-items:center;gap:15px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;position:relative;
  overflow:hidden;font-family:inherit;color:inherit}
.unit:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.unit .icon{width:72px;height:72px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;font-size:38px}
.unit .meta{flex:1;min-width:0}
.unit .no{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.75}
.unit .nm{font-size:20px;font-weight:800;margin:2px 0 3px}
.unit .en{font-size:13px;color:var(--soft);font-weight:600}
.bar{height:9px;border-radius:9px;background:#f0e7db;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.unit .badge{position:absolute;top:10px;right:12px;font-size:23px}
.setdots{display:flex;gap:5px;margin-top:8px;font-size:11px;font-weight:800;color:var(--soft)}
.setdots span{padding:2px 8px;border-radius:8px;background:#f2eae0}
.setdots span.full{background:var(--goodb);color:var(--good)}

.shelf{background:#fff;border-radius:var(--r);padding:16px 18px;margin-top:20px;box-shadow:0 5px 0 #e7dbcb}
.shelf h3{margin:0 0 10px;font-size:16px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bg{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:29px;
  background:#f4ece2;filter:grayscale(1);opacity:.45}
.bg.on{filter:none;opacity:1;background:#fff6dc;box-shadow:0 0 0 3px var(--gold) inset}

.banner{border-radius:var(--r);padding:20px;color:#fff;margin-bottom:16px;text-align:center}
.banner .bi{font-size:50px;line-height:1}
.banner h2{margin:6px 0 2px;font-size:23px}
.banner p{margin:0;opacity:.92;font-size:14px;font-weight:600}

.setpick{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 #e7dbcb}
.setpick h4{margin:0 0 10px;font-size:14px;color:var(--soft)}
.setrow{display:flex;gap:9px}
.setbtn{flex:1;border:none;font-family:inherit;background:#f4ece2;color:var(--soft);font-weight:800;font-size:16px;
  padding:13px 6px;border-radius:15px;cursor:pointer;position:relative}
.setbtn.on{color:#fff}
.setbtn .ok{position:absolute;top:3px;right:6px;font-size:12px}

.acts{display:grid;gap:12px}
.act{border:none;font-family:inherit;color:inherit;text-align:left;background:#fff;border-radius:var(--r);
  padding:15px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:0 5px 0 #e7dbcb;width:100%}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.act .ai{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:27px;flex:0 0 auto;background:#f6efe6}
.act .at{flex:1}
.act .at b{display:block;font-size:17px}
.act .at span{font-size:12.5px;color:var(--soft)}
.act .ck{font-size:22px;opacity:.25}
.act .ck.on{opacity:1}

.chtag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 11px;border-radius:10px;
  background:#f4ece2;color:#8a7a68;margin-bottom:10px}
.scene{position:relative;width:200px;height:150px;margin:0 auto 8px}
.sbox{position:absolute;width:80px;height:54px;border:5px solid #c39a68;background:#f8e8ce;border-radius:10px;z-index:1}
.sball{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-50%)}

.tcard{background:#fff;border-radius:26px;padding:24px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb;
  margin-bottom:15px;animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.tcard .pic{font-size:78px;line-height:1.15;margin-bottom:10px}
.tcard .en{font-size:28px;font-weight:800;margin-bottom:6px;line-height:1.35}
.tcard .zh{font-size:17px;color:var(--soft);font-weight:600;margin-bottom:15px}
.speak{border:none;font-family:inherit;cursor:pointer;background:var(--gold);color:#5b4400;font-weight:800;
  font-size:16px;padding:13px 25px;border-radius:18px;box-shadow:0 4px 0 #d9a015}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a015}
.tip{background:#fff9e6;border-radius:18px;padding:14px 16px;font-size:15px;font-weight:600;line-height:1.7;
  box-shadow:0 4px 0 #f0e2bd;margin-bottom:15px}
.tip b{color:#c47b00}
.dots{display:flex;justify-content:center;gap:6px;margin:2px 0 14px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#e2d5c4}
.dots i.on{width:22px;border-radius:9px}
.nav{display:flex;gap:11px}
.btn{flex:1;border:none;font-family:inherit;cursor:pointer;padding:15px;border-radius:18px;font-size:16px;
  font-weight:800;background:#fff;color:var(--ink);box-shadow:0 4px 0 #e7dbcb}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e7dbcb}
.btn.pri{color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.4;pointer-events:none}

.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;
  color:var(--soft);margin-bottom:9px}
.qcard{background:#fff;border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 6px 0 #e7dbcb;margin-bottom:15px}
.qcard .pic{font-size:66px;margin-bottom:8px}
.qcard .sent{font-size:25px;font-weight:800;line-height:1.55;margin-bottom:6px}
.blank{display:inline-block;min-width:86px;border-bottom:5px solid #ccc;color:transparent}
.blank.filled{color:var(--good);border-color:var(--good)}
.qcard .zh{font-size:15px;color:var(--soft);font-weight:600}
.opts{display:grid;gap:11px}
.opt{border:none;font-family:inherit;cursor:pointer;width:100%;background:#fff;padding:17px;border-radius:20px;
  font-size:21px;font-weight:800;box-shadow:0 5px 0 #e7dbcb;color:var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #e7dbcb}
.opt.ok{background:var(--goodb);color:var(--good);box-shadow:0 5px 0 #b6e6cf}
.opt.no{background:var(--badb);color:var(--bad);box-shadow:0 5px 0 #f7c3ba;animation:shake .4s}
.opt.dim{opacity:.4}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{border-radius:20px;padding:14px 16px;font-size:15.5px;font-weight:700;line-height:1.65;margin-top:13px;animation:slide .3s ease}
.fb.ok{background:var(--goodb);color:#1d7a4b}
.fb.no{background:var(--badb);color:#b23a28}

.hintline{text-align:center;font-size:14px;color:var(--soft);font-weight:700;margin-bottom:13px;line-height:1.6}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
@media(max-width:420px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:#fff;border-radius:20px;padding:12px 7px;text-align:center;box-shadow:0 5px 0 #e7dbcb}
.mcard .pic{font-size:44px;line-height:1.1}
.slot{margin-top:9px;min-height:44px;border-radius:14px;border:3px dashed #ddd0be;display:grid;place-items:center;
  font-size:15px;font-weight:800;color:#c3b5a3;padding:4px 5px;word-break:break-word}
.slot.hot{background:#fff2e6;transform:scale(1.05)}
.slot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.slot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.fsent{background:#fff;border-radius:22px;padding:18px 15px;box-shadow:0 5px 0 #e7dbcb;margin-bottom:11px;
  display:flex;gap:12px;align-items:center}
.fsent .pic{font-size:38px;flex:0 0 auto}
.fsent .body{flex:1}
.fsent .line{font-size:20px;font-weight:800;line-height:1.95}
.fsent .zh{font-size:13px;color:var(--soft);font-weight:600;margin-top:4px}
.islot{display:inline-grid;place-items:center;vertical-align:middle;min-width:90px;height:40px;border-radius:12px;
  border:3px dashed #ddd0be;color:#c3b5a3;font-size:17px;padding:0 8px;margin:0 3px}
.islot.hot{background:#fff2e6}
.islot.done{border:3px solid var(--good);background:var(--goodb);color:var(--good)}
.islot.wrong{border-color:var(--bad);background:var(--badb);color:var(--bad);animation:shake .4s}

.bank{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-radius:26px 26px 0 0;
  padding:13px 15px calc(15px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.1);
  display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:760px;margin:0 auto}
.chip{color:#fff;font-weight:800;font-size:18px;padding:12px 18px;border-radius:16px;
  box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:grab;touch-action:none;user-select:none}
.chip.sel{outline:4px solid var(--gold);transform:translateY(-4px)}
.chip.dragging{opacity:.3}
.chip.used{visibility:hidden}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.95;transform:scale(1.1) rotate(-3deg);margin:0}

.done{background:#fff;border-radius:26px;padding:34px 20px;text-align:center;box-shadow:0 6px 0 #e7dbcb}
.done .big{font-size:74px;animation:bounce .7s ease}
@keyframes bounce{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.done h2{font-size:24px;margin:10px 0 6px}
.done p{color:var(--soft);font-weight:600;margin:0 0 8px}
.done .got{font-size:31px;letter-spacing:4px;margin:12px 0 18px}
.conf{position:fixed;top:-20px;font-size:24px;z-index:900;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.1}}

/* ---------- 老師模式 ---------- */
.tsec{background:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 5px 0 #e7dbcb}
.tsec h3{margin:0 0 4px;font-size:17px}
.tsec p.d{margin:0 0 12px;font-size:13px;color:var(--soft);font-weight:600;line-height:1.6}
.picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.pk{border:none;font-family:inherit;background:#f4ece2;color:var(--soft);font-weight:800;font-size:14px;
  padding:10px 14px;border-radius:13px;cursor:pointer}
.pk.on{background:var(--ink);color:#fff}
.tgo{border:none;font-family:inherit;width:100%;padding:14px;border-radius:16px;font-size:16px;font-weight:800;
  color:#fff;background:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tgo:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.switch b{font-size:15px}
.switch span{font-size:12.5px;color:var(--soft);font-weight:600;display:block;margin-top:2px}
.sw{width:56px;height:32px;border-radius:20px;background:#ddd0be;position:relative;flex:0 0 auto;cursor:pointer;border:none}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on{background:var(--good)}
.sw.on i{left:28px}

table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{padding:8px 6px;text-align:left;border-bottom:1px solid #f0e7db}
table.rep th{font-size:12px;color:var(--soft)}
table.rep td.n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:9px;font-size:12px;font-weight:800}
.pill.g{background:var(--goodb);color:var(--good)}
.pill.y{background:#fff2d4;color:#b5820c}
.pill.r{background:var(--badb);color:var(--bad)}
.wrongitem{background:#fffaf6;border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:14px;line-height:1.7}
.wrongitem b{color:var(--bad)}

/* ---------- 投影模式 ---------- */
#proj{position:fixed;inset:0;z-index:200;background:#fffdf8;display:none;flex-direction:column;padding:20px}
#proj.on{display:flex}
#proj .ph{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;color:var(--soft)}
#proj .pbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
#proj .ppic{font-size:min(18vw,140px);line-height:1}
#proj .psent{font-size:min(7vw,62px);font-weight:800;line-height:1.4}
#proj .pzh{font-size:min(3.4vw,28px);color:var(--soft);font-weight:700}
#proj .popts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#proj .popt{font-size:min(4.4vw,38px);font-weight:800;padding:14px 30px;border-radius:18px;background:#f4ece2}
#proj .popt.ok{background:var(--goodb);color:var(--good)}
#proj .pwhy{font-size:min(3vw,25px);font-weight:700;background:#fff9e6;border-radius:16px;padding:14px 20px;max-width:900px}
#proj .pf{display:flex;gap:12px;justify-content:center}
#proj .pf button{border:none;font-family:inherit;font-size:19px;font-weight:800;padding:15px 28px;border-radius:16px;
  background:#fff;box-shadow:0 4px 0 #e7dbcb;cursor:pointer;color:var(--ink)}
#proj .pf button.pri{background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#proj .scene{transform:scale(1.5);margin:24px auto 30px}
@media(max-width:700px){
  #proj{padding:14px 10px}
  #proj .ph{font-size:13px}
  #proj .pf{flex-wrap:wrap;gap:8px}
  #proj .pf button{font-size:15px;padding:12px 15px}
  #proj .psent{font-size:30px}
  #proj .pzh{font-size:16px}
  #proj .popt{font-size:22px;padding:11px 20px}
  #proj .pwhy{font-size:15px;padding:11px 14px}
  #proj .ppic{font-size:74px}
}

/* ---------- 列印 ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  body::before{display:none}
  #app,#proj,#bankwrap{display:none !important}
  #print{display:block !important;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",serif;color:#000}
  .sheet{page-break-after:always;padding:0}
  .sheet:last-child{page-break-after:auto}
}
#print .sheet{max-width:760px;margin:0 auto 40px;background:#fff;padding:24px}
#print h1{font-size:22px;margin:0 0 4px;border-bottom:3px solid #000;padding-bottom:8px}
#print .meta{font-size:13px;margin:8px 0 18px;display:flex;gap:26px}
#print h2{font-size:16px;margin:20px 0 10px;background:#eee;padding:6px 10px;border-radius:4px}
#print ol{margin:0;padding-left:22px}
#print li{margin-bottom:11px;font-size:14.5px;line-height:1.85}
#print .zhs{color:#555;font-size:12.5px;margin-left:6px}
#print .ops{margin-left:6px;font-size:14px}
#print .wordbank{border:1.5px dashed #666;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px;
  font-weight:700;letter-spacing:1px}
#print .mtab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#print .mcell{border:1.5px solid #999;border-radius:8px;padding:10px;text-align:center}
#print .mcell .e{font-size:34px}
#print .mcell .ln{border-bottom:1.5px solid #000;height:22px;margin-top:8px}
#print .key{font-size:14px;line-height:2}
#print .key b{display:inline-block;min-width:34px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bankwrap"></div>
<div id="proj"></div>
<div id="print"></div>

<script>
/* ============================================================
   題庫：Basic English Grammar 4th Ed. (Azar & Hagen) Ch1–Ch4
   每單元 12 個題型槽位，每槽位有 A / B / C 三種題目（同難度、不同題）
   圖案一律使用 Unicode 6.x 通用 emoji，避免舊機型顯示空白框
   ============================================================ */
const UNITS = [
/* ================= UNIT 1 ================= */
{
  id:1, no:"UNIT 1", name:"Be 動詞", en:"Chapter 1 · Using Be",
  emoji:"👦", cb:"--u1b", hex:"#ff8a3d", badge:"🏅",
  rule:"I 配 <b>am</b>　He / She / It 配 <b>is</b>　You / We / They 配 <b>are</b>",
  teach:[
    {ch:"1-1", pic:"🙋", en:["I ","am"," late."], zh:"我遲到了。", tip:"看到 <b>I</b> 就用 <b>am</b>，永遠不變。"},
    {ch:"1-1", pic:"👩", en:["She ","is"," late."], zh:"她遲到了。", tip:"Maria is late. → <b>She</b> is late.　「她」用 <b>is</b>。"},
    {ch:"1-1", pic:"👨", en:["He ","is"," late."], zh:"他遲到了。", tip:"Tom is late. → <b>He</b> is late.　「他」用 <b>is</b>。"},
    {ch:"1-1", pic:"🚌", en:["It ","is"," late."], zh:"它遲到了。", tip:"Bus 10 is late. → <b>It</b> is late.　東西、動物用 <b>It</b>。"},
    {ch:"1-2", pic:"👪", en:["We ","are"," here."], zh:"我們在這裡。", tip:"Sam and I ＝ <b>We</b>。兩個人以上用 <b>are</b>。"},
    {ch:"1-2", pic:"👬", en:["They ","are"," here."], zh:"他們在這裡。", tip:"Sam and Lisa ＝ <b>They</b>，用 <b>are</b>。"},
    {ch:"1-3", pic:"🍁", en:["Canada is ","a"," country."], zh:"加拿大是一個國家。", tip:"一個東西前面要加 <b>a</b>。不可以說 Canada is country。"},
    {ch:"1-3", pic:"🌴", en:["Bali is ","an"," island."], zh:"峇里島是一座島。", tip:"開頭發 <b>a / e / i / o</b> 的音要用 <b>an</b>：an island、an animal、an ear。"},

/* 由 quizSlots / matchSets / fillSets 展開成 A、B、C 三卷 */
const SETS = ["A","B","C"];
UNITS.forEach(u=>{
  u.sets = {};
  SETS.forEach(t=>u.sets[t] = {quiz:[], match:[], fill:[]});
  u.quizSlots.forEach((slot,si)=>{
    SETS.forEach(t=>{
      const v = slot[t]; if(!v) return;
      u.sets[t].quiz.push({
        id: u.id+"-"+t+"-q"+si,
        ch: v.ch || slot.ch,
        pic: v.pic, scene: v.scene,
        a: v.a, b: v.b, zh: v.zh,
        o: v.o || slot.o,
        k: v.k,
        why: v.why || slot.why
      });
    });
  });
  SETS.forEach(t=>{
    u.sets[t].match = (u.matchSets[t]||[]).map((m,i)=>Object.assign({id:u.id+"-"+t+"-m"+i}, m));
    u.sets[t].fill  = (u.fillSets[t]||[]).map((f,i)=>Object.assign({id:u.id+"-"+t+"-f"+i}, f));
  });
});

let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!window.speechSynthesis||!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
    u.lang='en-US'; u.rate=0.72; u.pitch=1.15;
    if(!VOICES.length) loadVoices();
    const v=VOICES.find(v=>/en[-_]US/i.test(v.lang))||VOICES.find(v=>/^en/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let AC=null;
function tone(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    (ok?[660,880,1180]:[300,200]).forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime+i*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

function el(tag,cls,html){ const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripTags(s){ return String(s==null?'':s).replace(/<[^>]*>/g,''); }
function addStars(n){

  const b=document.querySelector('.starbox');
  if(b){ b.querySelector('.n').textContent=S.stars; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
}
function confetti(){
  const e=['⭐','🎉','✨','🌟','🎊','💛'];
  for(let i=0;i<24;i++){
    const d=el('div','conf',e[Math.floor(Math.random()*e.length)]);

}
function setDone(u,t){ const d=S.done[u.id][t]; return d.teach&&d.quiz&&d.match&&d.fill; }
function unitDone(u){ return SETS.some(t=>setDone(u,t)); }
function unitAllSets(u){ return SETS.every(t=>setDone(u,t)); }
function pct(u){
  let n=0; SETS.forEach(t=>['teach','quiz','match','fill'].forEach(k=>{ if(S.done[u.id][t][k]) n++; }));
  return n/12*100;
}
function go(screen,opt){ Object.assign(S,{screen},opt||{}); render(); window.scrollTo(0,0); }
function unitById(id){ return UNITS.find(u=>u.id===id); }

const SPOS={'in':[100,75],'on':[100,31],'above':[100,10],'under':[100,119],'next to':[164,75],'behind':[86,50]};
function sceneHTML(rel){
  if(rel==='between'){
    return '<div class="scene">'+
      '<div class="sbox" style="left:8px;top:48px;width:62px"></div>'+
      '<div class="sbox" style="left:130px;top:48px;width:62px"></div>'+
      '<div class="sball" style="left:100px;top:75px;z-index:2">⚽</div></div>';
  }
  const p=SPOS[rel]||SPOS['in'], back=(rel==='behind');
  return '<div class="scene">'+
    (back?'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:0">⚽</div>':'')+
    '<div class="sbox" style="left:60px;top:48px"></div>'+
    (back?'':'<div class="sball" style="left:'+p[0]+'px;top:'+p[1]+'px;z-index:2">⚽</div>')+
    '</div>';
}
function qSentence(q,ans){ return ((q.a?q.a+' ':'')+ans+' '+(q.b||'')).replace(/\s+/g,' ').trim(); }

/* 記錄答題結果 */
function record(q,right){
  if(!S.stats[q.ch]) S.stats[q.ch]={right:0,wrong:0};
  S.stats[q.ch][right?'right':'wrong']++;
  if(right){ if(S.wrong[q.id]) delete S.wrong[q.id]; }
  else S.wrong[q.id]={ch:q.ch, sent:qSentence(q,'____'), ans:q.o[q.k], zh:q.zh, n:((S.wrong[q.id]||{}).n||0)+1};
  save();
}
function wrongList(){ return Object.keys(S.wrong).map(id=>Object.assign({id}, S.wrong[id])); }
function wrongQuestionsFor(unitId){
  const out=[];
  const u=unitById(unitId);
  SETS.forEach(t=>u.sets[t].quiz.forEach(q=>{ if(S.wrong[q.id]) out.push(q); }));
  return out;
}

let run=null;
function buildRun(u){
  let qs = S.reviewMode ? wrongQuestionsFor(u.id) : u.sets[S.set].quiz;
  if(!qs.length) qs=u.sets[S.set].quiz;
  if(S.shuffle) qs=shuffle(qs);
  const list=qs.map(q=>{
    let opts=q.o.map((t,i)=>({t,ok:i===q.k}));
    if(S.shuffle) opts=shuffle(opts);
    return {q, opts, k:opts.findIndex(o=>o.ok)};
  });
  return {list, i:0, got:0, picked:null, unit:u.id, review:S.reviewMode};
}
function renderQuiz(){
  const u=unitById(S.unit);
  if(!run||run.unit!==u.id||run.review!==S.reviewMode) run=buildRun(u);
  const item=run.list[run.i], q=item.q;
  app.innerHTML=''; bankwrap.innerHTML='';
  app.appendChild(topbar((S.reviewMode?'錯題複習 · ':'選一選 '+S.set+'卷 · ')+u.name,()=>{run=null;go('unit');}));

  app.appendChild(el('div','qhead',
    '<span>第 '+(run.i+1)+' / '+run.list.length+' 題</span><span>答對 '+run.got+' 題</span>'));

  const filled=run.picked!==null;
  const card=el('div','qcard');
  card.innerHTML=
    (q.ch?'<div class="chtag">課本 '+q.ch+'</div>':'')+
    (q.scene?sceneHTML(q.scene):'<div class="pic emo">'+q.pic+'</div>')+
    '<div class="sent">'+(q.a?q.a+' ':'')+
      '<span class="blank'+(filled?' filled':'')+'" style="border-color:'+(filled?'var(--good)':u.hex)+'">'+
        (filled?item.opts[item.k].t:'____')+'</span> '+(q.b||'')+'</div>'+
    '<div class="zh">'+q.zh+'</div>';
  app.appendChild(card);

  const opts=el('div','opts');
  item.opts.forEach((o,n)=>{
    const b=el('button','opt',o.t);
    if(filled){
      if(n===item.k) b.classList.add('ok');
      else if(n===run.picked) b.classList.add('no');
      else b.classList.add('dim');
    }
    b.onclick=()=>{
      if(run.picked!==null) return;
      run.picked=n;
      const right=(n===item.k);
      if(right){ run.got++; addStars(1); tone(true); } else tone(false);
      record(q,right);
      render();
      speak(qSentence(q,item.opts[item.k].t));
    };
    opts.appendChild(b);
  });
  app.appendChild(opts);

  if(filled){
    const ok=(run.picked===item.k);
    app.appendChild(el('div','fb '+(ok?'ok':'no'),
      (ok?'🎉 答對了！＋1 顆星　':'💪 再看一次：')+q.why));
    const nav=el('div','nav'); nav.style.marginTop='13px';
    const sp=el('button','btn','🔊 再聽一次');
    sp.onclick=()=>speak(qSentence(q,item.opts[item.k].t));
    const last=(run.i===run.list.length-1);
    const nx=el('button','btn pri',(last?'看成績 🎉':'下一題 →'));
    nx.style.background=u.hex;
    nx.onclick=()=>{
      if(last){
        const g=run.got, t=run.list.length, rev=run.review; run=null;
        if(rev){ go('unit'); }
        else finish(u,'quiz',2,'你答對了 '+g+' / '+t+' 題！');
      } else { run.i++; run.picked=null; render(); }
    };
    nav.appendChild(sp); nav.appendChild(nx);
    app.appendChild(nav);
  }
}

/* =========================================================
   拖曳引擎
   ========================================================= */
let drag=null, selected=null;
function makeDraggable(chip){
  chip.addEventListener('pointerdown', e=>{
    if(chip.classList.contains('used')) return;
    e.preventDefault();
    const r=chip.getBoundingClientRect();
    drag={chip,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null};
    window.addEventListener('pointermove',onMove,{passive:false});
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
  });
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)<9) return;
  e.preventDefault();
  if(!drag.moved){
    drag.moved=true;
    const g=drag.chip.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('sel','used');
    g.style.width=drag.w+'px'; g.style.height=drag.h+'px';
    document.body.appendChild(g); drag.ghost=g;
    drag.chip.classList.add('dragging'); clearSelect();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';
  drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  const s=slotAt(e.clientX,e.clientY);
  document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
  if(s) s.classList.add('hot');
}
function onUp(e){
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  if(!drag) return;
  const chip=drag.chip, moved=drag.moved;
  if(moved){
    if(drag.ghost) drag.ghost.remove();
    chip.classList.remove('dragging');
    document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
    const s=slotAt(e.clientX,e.clientY);
    drag=null; if(s) tryDrop(chip,s);
  } else {
    drag=null;
    if(selected===chip) clearSelect();
    else { clearSelect(); selected=chip; chip.classList.add('sel'); speak(chip.dataset.word); }
  }
}
function clearSelect(){ if(selected){ selected.classList.remove('sel'); selected=null; } }
function slotAt(x,y){
  const t=document.elementFromPoint(x,y); if(!t) return null;
  const s=t.closest('.slot,.islot');
  return (!s||s.classList.contains('done'))?null:s;
}
function bindSlot(s){
  s.addEventListener('click',()=>{
    if(s.classList.contains('done')) return;
    if(selected){ const c=selected; clearSelect(); tryDrop(c,s); }
  });
}
let gameState=null;
function tryDrop(chip,slot){
  if(!gameState) return;
  if(chip.dataset.word===slot.dataset.key){
    slot.textContent=chip.dataset.word; slot.classList.add('done'); slot.classList.remove('wrong');
    chip.classList.add('used');
    gameState.left--; addStars(1); tone(true); speak(gameState.speakFor(slot));
    if(gameState.left<=0) setTimeout(gameState.onWin,650);
  } else {
    slot.classList.add('wrong'); tone(false);
    setTimeout(()=>slot.classList.remove('wrong'),450);
  }
}
function buildBank(words,hex){
  bankwrap.innerHTML='';
  const b=el('div','bank');
  shuffle(words).forEach(w=>{
    const c=el('div','chip',w); c.dataset.word=w; c.style.background=hex;
    makeDraggable(c); b.appendChild(c);
  });
  bankwrap.appendChild(b); return b;
}

  go('done',{unit:u.id});

}

const P={list:[], i:0, shown:false};
function startProj(unitId,set){
  const u=unitById(unitId);
  P.list=u.sets[set].quiz.slice(); P.i=0; P.shown=false; P.u=u; P.set=set;
  projEl.classList.add('on'); drawProj();
}
function drawProj(){
  const q=P.list[P.i];
  projEl.innerHTML='';
  const ph=el('div','ph','<span>'+P.u.no+' · '+P.set+'卷　課本 '+q.ch+'</span><span>第 '+(P.i+1)+' / '+P.list.length+' 題</span>');
  projEl.appendChild(ph);
  const body=el('div','pbody');
  body.innerHTML=
    (q.scene?sceneHTML(q.scene):'<div class="ppic emo">'+q.pic+'</div>')+
    '<div class="psent">'+(q.a?q.a+' ':'')+'<u>'+(P.shown?q.o[q.k]:'　　　　')+'</u> '+(q.b||'')+'</div>'+
    '<div class="pzh">'+q.zh+'</div>';
  const po=el('div','popts');
  q.o.forEach((o,i)=>po.appendChild(el('div','popt'+(P.shown&&i===q.k?' ok':''),o)));
  body.appendChild(po);
  if(P.shown) body.appendChild(el('div','pwhy','💡 '+q.why));
  projEl.appendChild(body);

  const pf=el('div','pf');
  const prev=el('button','','← 上一題'); prev.disabled=(P.i===0);
  prev.onclick=()=>{P.i--;P.shown=false;drawProj();};
  const sp=el('button','','🔊 唸出來');
  sp.onclick=()=>speak(qSentence(q,q.o[q.k]));
  const rev=el('button','pri',P.shown?'蓋回答案':'公布答案');
  rev.onclick=()=>{P.shown=!P.shown; drawProj(); if(P.shown) speak(qSentence(q,q.o[q.k]));};
  const next=el('button','',P.i===P.list.length-1?'結束':'下一題 →');
  next.onclick=()=>{ if(P.i===P.list.length-1){ projEl.classList.remove('on'); projEl.innerHTML=''; }
                     else {P.i++;P.shown=false;drawProj();} };
  const close=el('button','','✕ 離開');
  close.onclick=()=>{ projEl.classList.remove('on'); projEl.innerHTML=''; };
  [prev,sp,rev,next,close].forEach(b=>pf.appendChild(b));
  projEl.appendChild(pf);
}

/* =========================================================
   列印學習單
   ========================================================= */
const LET=['A','B','C','D'];
/* 紙本用的介系詞圖（SVG，列印時看得到球和盒子的相對位置） */
const PSPOS={'in':[65,49],'on':[65,20],'above':[65,5],'under':[65,78],'next to':[107,49],'behind':[57,38]};
function printScene(rel){
  const box=(x)=>'<rect x="'+x+'" y="31" width="52" height="36" rx="5" fill="#f8e8ce" stroke="#333" stroke-width="2.5"/>';
  const ball=(cx,cy)=>'<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#fff" stroke="#333" stroke-width="2.5"/>'+
    '<path d="M'+(cx-11)+' '+cy+' h22 M'+cx+' '+(cy-11)+' v22" stroke="#333" stroke-width="1.6"/>';
  let inner;
  if(rel==='between') inner=box(6)+box(72)+ball(65,49);
  else {
    const p=PSPOS[rel]||PSPOS['in'];
    inner=(rel==='behind') ? ball(p[0],p[1])+box(39) : box(39)+ball(p[0],p[1]);
  }
  return '<svg width="130" height="100" viewBox="0 0 130 100" style="vertical-align:middle;margin:2px 8px">'+inner+'</svg>';
}
function buildPrint(unitId,set){
  const u=unitById(unitId), s=u.sets[set];
  let h='<div class="sheet">';
  h+='<h1>快樂學英文　'+u.no+'　'+esc(u.name)+'　【'+set+' 卷】</h1>';
  h+='<div style="font-size:12.5px;color:#444;margin-bottom:6px">'+esc(u.en)+'　／　'+stripTags(u.rule)+'</div>';
  h+='<div class="meta"><span>姓名：____________</span><span>班級：__________</span><span>日期：____ / ____</span><span>分數：________</span></div>';

  h+='<h2>一、選擇題（每題 4 分，共 48 分）</h2><ol>';
  s.quiz.forEach(q=>{
    const stem=(q.a?esc(q.a)+' ':'')+'________ '+esc(q.b||'');
    h+='<li>'+(q.scene?printScene(q.scene)+'<br>':'')+stem+
       '<span class="zhs">（'+esc(q.zh)+'）</span><br>'+
       '<span class="ops">'+q.o.map((o,i)=>'('+LET[i]+') '+esc(o)).join('　')+'</span></li>';
  });
  h+='</ol>';

  h+='<h2>二、看圖寫單字（每題 4 分，共 24 分）</h2>';
  h+='<div class="wordbank">單字庫：'+shuffle(s.match.map(m=>m.w)).map(esc).join('　／　')+'</div>';
  h+='<div class="mtab">'+s.match.map(m=>'<div class="mcell"><div class="e">'+m.pic+'</div><div class="ln"></div></div>').join('')+'</div>';

  h+='<h2>三、填空題（每題 4 分，共 24 分）</h2>';
  h+='<div class="wordbank">單字庫：'+shuffle(s.fill.map(f=>f.k)).map(esc).join('　／　')+'</div><ol>';
  s.fill.forEach(f=>{
    h+='<li>'+(f.pre?esc(f.pre)+' ':'')+'____________ '+esc(f.post)+
       '<span class="zhs">（'+esc(f.zh)+'）</span></li>';
  });
  h+='</ol></div>';

  /* 解答頁 */
  h+='<div class="sheet"><h1>解答　'+u.no+'　'+esc(u.name)+'　【'+set+' 卷】<span style="font-size:13px;font-weight:400">　教師用</span></h1>';
  h+='<h2>一、選擇題</h2><div class="key">';
  s.quiz.forEach((q,i)=>{
    h+='<div><b>'+(i+1)+'.</b> ('+LET[q.k]+') <b style="min-width:0">'+esc(q.o[q.k])+'</b>　'+
       '<span style="color:#555;font-size:13px">課本 '+q.ch+'：'+stripTags(q.why)+'</span></div>';
  });
  h+='</div><h2>二、看圖寫單字</h2><div class="key">';
  s.match.forEach((m,i)=>h+='<span style="display:inline-block;min-width:150px">'+(i+1)+'. '+m.pic+' '+esc(m.w)+'</span>');
  h+='</div><h2>三、填空題</h2><div class="key">';
  s.fill.forEach((f,i)=>h+='<div><b>'+(i+1)+'.</b> '+esc(f.k)+'　<span style="color:#555;font-size:13px">'+
    esc(((f.pre?f.pre+' ':'')+f.k+' '+f.post).replace(/\s+/g,' ').trim())+'</span></div>');
  h+='</div></div>';

  printEl.innerHTML=h;
}
function doPrint(unitId,set){ buildPrint(unitId,set); setTimeout(()=>window.print(),120); }

/* =========================================================
   路由
   ========================================================= */
function render(){
  clearSelect();
  switch(S.screen){
    case 'home': renderHome(); break;
    case 'unit': renderUnit(); break;
    case 'teach': renderTeach(); break;
    case 'quiz': renderQuiz(); break;
    case 'match': renderMatch(); break;
    case 'fill': renderFill(); break;
    case 'done': renderDone(); break;
    case 'teacher': renderTeacher(); break;
    case 'preview': renderPreview(); break;
  }
}
render();
